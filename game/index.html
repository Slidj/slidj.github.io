<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim: Pro UI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #000000; --card: #1c1c1e; --accent: #0a84ff; 
            --text: #fff; --red: #ff453a; --green: #30d158; --orange: #ff9f0a; --gray: #8e8e93;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 90px; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* СЦЕНА */
        .scene-container { position: relative; width: 100%; height: 260px; background-color: #2c2c2e; border-bottom: 1px solid #3a3a3c; overflow: hidden; }
        #visual-hero { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 70px; z-index: 10; transition: all 0.5s ease;}
        .room-item { position: absolute; font-size: 50px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 40px; }
        #item-bed { left: 30px; bottom: 40px; }
        .broken-visual { filter: grayscale(1) opacity(0.5); }

        /* UI */
        .ui { padding: 20px; }
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 14px; margin-bottom: 25px; }
        .money { color: var(--green); font-weight: 800; font-size: 20px; }

        .btn { background: var(--card); color: white; border: none; padding: 16px; width: 100%; margin-bottom: 12px; border-radius: 14px; display: flex; align-items: center; gap: 15px; cursor: pointer; text-align: left; transition: background 0.2s;}
        .btn:active { background: #2c2c2e; transform: scale(0.98); }
        .btn-icon { font-size: 24px; color: var(--accent); background: rgba(10, 132, 255, 0.15); padding: 10px; border-radius: 10px; }
        .section-title { font-size: 13px; color: var(--gray); margin: 20px 0 8px 5px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }

        /* --- SMART GRID ІЗ SVG РАМКАМИ --- */
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 5px; }
        
        .app-card { 
            position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; 
        }
        
        /* Контейнер для іконки та SVG */
        .icon-wrapper {
            position: relative; width: 72px; height: 72px;
            display: flex; justify-content: center; align-items: center;
        }

        /* Сама іконка (фон) */
        .app-bg {
            width: 60px; height: 60px; background: var(--card); border-radius: 14px;
            display: flex; justify-content: center; align-items: center; z-index: 1;
        }
        .app-emoji { font-size: 32px; }

        /* SVG ПРОГРЕС БАР (Рамка) */
        .progress-svg {
            position: absolute; top: 0; left: 0; width: 72px; height: 72px;
            transform: rotate(-90deg); /* Починаємо зверху */
            z-index: 2; pointer-events: none;
        }
        .progress-bg-ring { fill: none; stroke: #333; stroke-width: 3; } /* Сіра підкладка */
        .progress-ring { 
            fill: none; stroke-width: 3; stroke-linecap: round; 
            transition: stroke-dashoffset 0.5s linear, stroke 0.3s; 
        }

        /* Підпис */
        .app-label { font-size: 11px; color: #fff; margin-top: 8px; text-align: center; }

        /* Бейдж (Інфо) */
        .app-badge {
            position: absolute; bottom: -5px;
            font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 8px;
            background: #333; color: white; border: 2px solid var(--bg); z-index: 10;
        }

        /* ACTION SHEET */
        #action-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: #1c1c1e; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 25px; box-sizing: border-box; transition: bottom 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        #action-sheet.open { bottom: 0; }
        .sheet-emoji { font-size: 60px; display: block; margin-bottom: 10px; text-align: center; }
        .sheet-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-cancel { background: #2c2c2e; color: white; }

        /* Tabs & Nav */
        .tab { display: none; } .tab.active { display: block; animation: fade 0.2s; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px); display: flex; padding: 10px 0; border-top: 1px solid #333; z-index: 300; }
        .nav-btn { flex: 1; background: none; border: none; font-size: 26px; color: #666; transition: 0.2s; }
        .nav-btn.active { color: var(--accent); transform: translateY(-2px); }
        
        /* Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 900; color: white; backdrop-filter: blur(8px); }
        .overlay-loader { font-size: 60px; animation: pulse 1s infinite; margin-bottom: 10px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="overlay"><div class="overlay-loader" id="overlay-icon">⏳</div><h3 id="overlay-text">...</h3></div>

    <div id="action-sheet"><div id="sheet-content"></div></div>

    <div class="scene-container">
        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="header">
            <div>💵 <span id="money">0</span></div>
            <div>⚡ <span id="energy">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <div class="section-title">Активності</div>
            <button class="btn" onclick="work()">
                <div class="btn-icon"><i class="ri-code-s-slash-line"></i></div>
                <div><b>Фріланс</b><br><small style="color:#aaa">+15$ | -10 Енергії | Знос ПК</small></div>
            </button>
            <button class="btn" onclick="sleep()">
                <div class="btn-icon"><i class="ri-moon-line"></i></div>
                <div><b>Відпочинок</b><br><small style="color:#aaa">+20 Енергії | Знос ліжка</small></div>
            </button>
        </div>

        <div id="tab-inv" class="tab">
            <div class="section-title">Мої речі</div>
            <div id="inventory-grid" class="inventory-grid"></div>
        </div>

        <div id="tab-shop" class="tab">
             <div class="section-title">Пристрої</div>
            <button class="btn" onclick="buyItem('pc', 150)">
                <div class="btn-icon"><i class="ri-computer-line"></i></div>
                <div><b>iMac Pro</b> (150$)<br><small style="color:#aaa">Інструмент розробника</small></div>
            </button>
            <button class="btn" onclick="buyItem('bed', 100)">
                <div class="btn-icon"><i class="ri-home-wifi-line"></i></div>
                <div><b>Smart Bed</b> (100$)<br><small style="color:#aaa">Відновлення сил</small></div>
            </button>
             <div class="section-title">Доставка їжі</div>
            <button class="btn" onclick="buyFood('pizza', 20)">
                <div class="btn-icon">🍕</div>
                <div><b>Піца</b> (20$)<br><small style="color:#aaa">Псується за 30с</small></div>
            </button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="ri-home-fill"></i></button>
        <button class="nav-btn" onclick="switchTab('inv', this)"><i class="ri-apps-fill"></i></button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><i class="ri-shopping-bag-fill"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let game = { money: 300, energy: 100, inventory: [] };
        if(localStorage.getItem('simBorders')) game = JSON.parse(localStorage.getItem('simBorders'));

        // ОНОВЛЕННЯ ТАЙМЕРІВ
        setInterval(() => {
            let needsRender = false;
            const now = Date.now();
            game.inventory.forEach(item => {
                if (item.category === 'food' && !item.isSpoiled && now > item.expireTime) {
                    item.isSpoiled = true; needsRender = true;
                }
            });
            if(needsRender) { render(); save(); }
            if(document.getElementById('tab-inv').classList.contains('active')) renderGrid();
        }, 1000);

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;

            const pc = game.inventory.find(i => i.id === 'pc');
            const bed = game.inventory.find(i => i.id === 'bed');
            
            document.getElementById('item-pc').style.display = pc ? 'block' : 'none';
            if(pc) document.getElementById('item-pc').className = pc.hp <= 0 ? 'room-item broken-visual' : 'room-item';
            
            document.getElementById('item-bed').style.display = bed ? 'block' : 'none';
            if(bed) document.getElementById('item-bed').className = bed.hp <= 0 ? 'room-item broken-visual' : 'room-item';
        }

        // --- ГЕНЕРАЦІЯ СІТКИ З РАМКАМИ ---
        function renderGrid() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";
            const now = Date.now();

            if (game.inventory.length === 0) {
                grid.innerHTML = "<div style='grid-column:1/-1;text-align:center;color:#555;padding:20px'>Пусто</div>";
                return;
            }

            game.inventory.forEach((item, index) => {
                let emoji = "📦";
                let percent = 100;
                let strokeColor = "#30d158"; // Green
                let badgeText = "";

                // ТЕХНІКА (Знос)
                if (item.category === 'device') {
                    emoji = item.id === 'pc' ? "🖥️" : "🛏️";
                    percent = item.hp; // 0..100
                    
                    if(item.hp > 50) strokeColor = "#30d158"; // Зелений
                    else if(item.hp > 20) strokeColor = "#ff9f0a"; // Жовтий
                    else strokeColor = "#ff453a"; // Червоний

                    if(item.hp <= 0) badgeText = "ЗЛАМ.";
                    else badgeText = item.hp + "%";
                }

                // ЇЖА (Час)
                if (item.category === 'food') {
                    emoji = item.id === 'pizza' ? "🍕" : "🍣";
                    if (item.isSpoiled) {
                        emoji = "🤢"; percent = 0; strokeColor = "#555"; badgeText = "Сміття";
                    } else {
                        const totalTime = 30000; // 30 сек всього (хардкод для тесту)
                        const timeLeft = Math.max(0, item.expireTime - now);
                        percent = (timeLeft / totalTime) * 100;
                        strokeColor = "#0a84ff"; // Blue timer
                        badgeText = Math.ceil(timeLeft/1000) + "с";
                    }
                }

                // МАГІЯ SVG: Рахуємо довжину лінії
                // Периметр рамки 60x60 з радіусом 14. Приблизно ~220 одиниць.
                // Ми використовуємо pathLength="100" щоб не мучитись з математикою.
                // stroke-dasharray="100" stroke-dashoffset="100 - percent"
                
                grid.innerHTML += `
                <div class="app-card" onclick="openSheet(${index})">
                    <div class="icon-wrapper">
                        <div class="app-bg"><span class="app-emoji">${emoji}</span></div>
                        
                        <svg class="progress-svg" viewBox="0 0 72 72">
                            <rect class="progress-bg-ring" x="3" y="3" width="66" height="66" rx="16" />
                            <rect class="progress-ring" x="3" y="3" width="66" height="66" rx="16" 
                                pathLength="100"
                                stroke-dasharray="100"
                                stroke-dashoffset="${100 - percent}"
                                style="stroke: ${strokeColor};"
                            />
                        </svg>

                        <div class="app-badge">${badgeText}</div>
                    </div>
                    <div class="app-label">${item.name}</div>
                </div>`;
            });
        }

        // --- ЛОГІКА ---
        function openSheet(index) {
            const item = game.inventory[index];
            const sheet = document.getElementById('action-sheet');
            const content = document.getElementById('sheet-content');
            
            let btn = "";
            let desc = "";

            if (item.category === 'device') {
                if (item.hp <= 0) {
                    desc = "Потрібен капітальний ремонт";
                    btn = `<button class="sheet-btn btn-primary" onclick="repair(${index})">🛠️ Ремонт за 50$</button>`;
                } else {
                    desc = `Стан: ${item.hp}% (Все добре)`;
                    btn = item.hp < 100 
                        ? `<button class="sheet-btn btn-primary" onclick="repair(${index})">🔧 Підлатати (50$)</button>` 
                        : `<button class="sheet-btn" style="background:#333;color:#777">Ремонт не потрібен</button>`;
                }
            } else {
                if(item.isSpoiled) {
                    desc = "Вже не можна їсти";
                    btn = `<button class="sheet-btn" style="background:#ff453a;color:white" onclick="trash(${index})">🗑️ Викинути</button>`;
                } else {
                    desc = "Відновить +20 Енергії";
                    btn = `<button class="sheet-btn btn-primary" onclick="eat(${index})">🍽️ З'їсти</button>`;
                }
            }

            content.innerHTML = `
                <span class="sheet-emoji">${item.name === 'ПК' ? '🖥️' : (item.category === 'food' ? (item.isSpoiled?'🤢':'🍕') : '🛏️')}</span>
                <div style="text-align:center; font-size:20px; font-weight:bold; margin-bottom:5px;">${item.name}</div>
                <div style="text-align:center; color:#888; margin-bottom:20px;">${desc}</div>
                ${btn}
                <button class="sheet-btn btn-cancel" onclick="closeSheet()">Закрити</button>
            `;
            sheet.classList.add('open');
        }

        function closeSheet() { document.getElementById('action-sheet').classList.remove('open'); }

        function work() {
            const pc = game.inventory.find(i => i.id === 'pc');
            if (!pc || pc.hp <= 0) return alert('ПК зламаний!');
            if (game.energy < 10) return alert('Втома!');
            overlay("👨‍💻", "КОДИНГ...");
            setTimeout(() => { game.money+=15; game.energy-=10; pc.hp-=15; endAction(); }, 1500);
        }
        function sleep() {
            const bed = game.inventory.find(i => i.id === 'bed');
            if (!bed || bed.hp <= 0) return alert('Ліжко зламане!');
            overlay("😴", "СОН...");
            setTimeout(() => { game.energy = Math.min(100, game.energy+25); bed.hp-=5; endAction(); }, 1500);
        }
        function repair(i) {
            if(game.money<50) { closeSheet(); return alert("Треба 50$"); }
            game.money-=50; game.inventory[i].hp=100; closeSheet(); save(); render(); renderGrid();
        }
        function eat(i) {
            game.energy = Math.min(100, game.energy+20);
            game.inventory.splice(i,1); closeSheet(); save(); render(); renderGrid();
        }
        function trash(i) { game.inventory.splice(i,1); closeSheet(); save(); render(); renderGrid(); }
        
        function buyItem(id, p) { 
            if(game.inventory.some(i=>i.id===id)) return alert("Вже є!");
            if(game.money<p) return alert("Нема грошей");
            game.money-=p; game.inventory.push({id, name: id==='pc'?'ПК':'Ліжко', category:'device', hp:100}); 
            save(); render();
        }
        function buyFood(id, p) {
            if(game.money<p) return alert("Нема грошей");
            game.money-=p; 
            game.inventory.push({id, name:'Піца', category:'food', expireTime:Date.now()+30000, isSpoiled:false});
            save(); render();
        }

        function overlay(e,t) { document.getElementById('overlay-icon').innerText=e; document.getElementById('overlay-text').innerText=t; document.getElementById('overlay').style.display='flex'; }
        function endAction() { document.getElementById('overlay').style.display='none'; save(); render(); }
        function save() { localStorage.setItem('simBorders', JSON.stringify(game)); }
        
        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'inv') renderGrid();
        }
        render();
    </script>
</body>
</html>
