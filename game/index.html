<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS v15: Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #000; --card: #1c1c1e; --accent: #0a84ff; 
            --text: #fff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --gray: #8e8e93;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 90px; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* КНОПКА СКИДАННЯ */
        .reset-btn { position: fixed; top: 10px; right: 10px; z-index: 9999; background: rgba(255, 69, 58, 0.3); color: white; border: 1px solid var(--red); padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; }

        /* СЦЕНА */
        .scene-container { position: relative; width: 100%; height: 260px; background-color: #2c2c2e; border-bottom: 1px solid #333; overflow: hidden; }
        #visual-hero { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 70px; z-index: 10; transition: 0.5s; }
        .room-item { position: absolute; font-size: 50px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 40px; }
        #item-bed { left: 30px; bottom: 40px; }
        .broken-visual { filter: grayscale(1) opacity(0.5); }

        /* ШТОРКА СЦЕНИ */
        #scene-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: white;
        }
        .overlay-emoji { font-size: 60px; margin-bottom: 10px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* UI */
        .ui { padding: 20px; }
        .widget-header { background: #1c1c1e; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; border: 1px solid #333; }
        .money { font-size: 28px; font-weight: 800; color: var(--green); }

        /* --- НОВИЙ МАГАЗИН (POSTER STYLE) --- */
        .shop-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); /* 2 картки в ряд */
            gap: 15px;
        }

        .shop-card {
            background: var(--card); border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column;
            border: 1px solid #333; position: relative;
        }

        .poster-visual {
            height: 100px; background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
            display: flex; justify-content: center; align-items: center;
            font-size: 50px;
        }

        .poster-info { padding: 12px; display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
        
        .poster-title { font-weight: bold; font-size: 15px; }
        .poster-desc { font-size: 11px; color: #888; line-height: 1.2; margin-bottom: 5px; height: 26px; overflow: hidden; }

        /* Бейджі характеристик */
        .specs-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .spec-pill { 
            font-size: 10px; padding: 3px 6px; border-radius: 4px; background: #333; color: #ccc; 
            display: flex; align-items: center; gap: 3px;
        }
        .spec-green { color: var(--green); background: rgba(48, 209, 88, 0.1); }
        .spec-blue { color: var(--accent); background: rgba(10, 132, 255, 0.1); }
        .spec-orange { color: var(--orange); background: rgba(255, 159, 10, 0.1); }

        .buy-btn {
            margin-top: auto; /* Притискає кнопку до низу */
            background: #333; color: white; border: none;
            padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: background 0.2s;
        }
        .buy-btn:active { transform: scale(0.98); }
        .buy-btn.can-buy { background: var(--accent); }

        /* --- APP GRID (ДЛЯ ІНВЕНТАРЯ І ДОМУ) --- */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .app-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-card:active .icon-wrapper { transform: scale(0.95); }

        .icon-wrapper { position: relative; width: 68px; height: 68px; display: flex; justify-content: center; align-items: center; }
        .app-bg { width: 58px; height: 58px; background: var(--card); border-radius: 16px; display: flex; justify-content: center; align-items: center; z-index: 1; border: 1px solid #333; }
        .app-emoji { font-size: 28px; }
        
        .progress-svg { position: absolute; top: 0; left: 0; width: 68px; height: 68px; transform: rotate(-90deg); z-index: 2; pointer-events: none; }
        .progress-ring { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear; }

        .app-label { font-size: 11px; margin-top: 8px; color: #fff; }
        .app-badge { position: absolute; bottom: -5px; right: -5px; z-index: 3; font-size: 9px; font-weight: bold; padding: 2px 5px; background: #333; border-radius: 6px; border: 2px solid var(--bg); }

        /* ACTION SHEET */
        #action-sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #1c1c1e; padding: 25px; box-sizing: border-box; transition: bottom 0.3s; z-index: 1000; border-top: 1px solid #333; }
        #action-sheet.open { bottom: 0; }
        .sheet-btn { width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* NAV */
        .tab { display: none; } .tab.active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(20,20,20,0.9); backdrop-filter: blur(10px); display: flex; padding: 10px 0; border-top: 1px solid #333; z-index: 300; }
        .nav-btn { flex: 1; background: none; border: none; font-size: 26px; color: #666; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

    <button class="reset-btn" onclick="hardReset()">RESET</button>
    <div id="action-sheet"><div id="sheet-content"></div></div>

    <div class="scene-container">
        <div id="scene-overlay">
            <div class="overlay-emoji" id="overlay-icon">⏳</div>
            <div style="font-weight:bold" id="overlay-text">ДІЯ...</div>
        </div>
        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="widget-header">
            <div><div class="money"><span id="money">0</span> $</div><div style="font-size:12px;color:#666">Фінанси</div></div>
            <div style="font-weight:bold;color:var(--green)">⚡ <span id="energy">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <div style="color:#666;font-size:12px;margin-bottom:10px">ДОДАТКИ</div>
            <div class="app-grid">
                <div class="app-card" onclick="work(this)">
                    <div class="icon-wrapper">
                        <div class="app-bg"><span class="app-emoji">💻</span></div>
                        <svg class="progress-svg" viewBox="0 0 72 72"><rect class="progress-ring" x="4" y="4" width="64" height="64" rx="14" stroke="#64d2ff" stroke-dasharray="200" stroke-dashoffset="0" /></svg>
                        <div class="app-badge">3с</div>
                    </div>
                    <div class="app-label">Фріланс</div>
                </div>
                <div class="app-card" onclick="sleep(this)">
                    <div class="icon-wrapper">
                        <div class="app-bg"><span class="app-emoji">😴</span></div>
                        <svg class="progress-svg" viewBox="0 0 72 72"><rect class="progress-ring" x="4" y="4" width="64" height="64" rx="14" stroke="#bf5af2" stroke-dasharray="200" stroke-dashoffset="0" /></svg>
                        <div class="app-badge">3с</div>
                    </div>
                    <div class="app-label">Сон</div>
                </div>
                <div class="app-card" onclick="openBank()">
                    <div class="icon-wrapper"><div class="app-bg"><span class="app-emoji">🏦</span></div><div class="app-badge" style="background:green">$$$</div></div>
                    <div class="app-label">Банк</div>
                </div>
            </div>
        </div>

        <div id="tab-inv" class="tab">
            <div style="color:#666;font-size:12px;margin-bottom:10px">МОЇ РЕЧІ</div>
            <div id="inventory-grid" class="app-grid"></div>
        </div>

        <div id="tab-shop" class="tab">
            <div style="color:#666;font-size:12px;margin-bottom:10px">МАРКЕТПЛЕЙС</div>
            <div id="shop-grid" class="shop-grid">
                </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="ri-home-fill"></i></button>
        <button class="nav-btn" onclick="switchTab('inv', this)"><i class="ri-apps-fill"></i></button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><i class="ri-shopping-bag-fill"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. БАЗА ДАНИХ ТОВАРІВ (Щоб легко додавати нові)
        const shopItems = [
            { 
                id: 'pc', type: 'device', name: 'iMac Pro', price: 150, icon: '🖥️', 
                desc: 'Потужний ПК для фрілансу та розробки ігор.',
                specs: ['⚡ -10 Енергії', '💰 +20$/клік']
            },
            { 
                id: 'bed', type: 'device', name: 'Smart Bed', price: 100, icon: '🛏️', 
                desc: 'Ортопедичне ліжко для швидкого сну.',
                specs: ['⚡ +30 Енергії', '💤 3 сек']
            },
            { 
                id: 'pizza', type: 'food', name: 'Pepperoni', price: 20, icon: '🍕', 
                desc: 'Свіжа піца. Швидко псується!',
                specs: ['⚡ +20 Енергії', '⏳ Термін: 30с']
            },
            { 
                id: 'sushi', type: 'food', name: 'Sushi Set', price: 40, icon: '🍣', 
                desc: 'Преміум набір. Відновлює здоров\'я.',
                specs: ['⚡ +35 Енергії', '⏳ Термін: 20с']
            }
        ];

        let game = { money: 300, energy: 100, inventory: [], debt: 0 };
        try {
            const saved = localStorage.getItem('lifeSim_v15'); 
            if(saved) game = JSON.parse(saved);
            if(!game.inventory) game.inventory = [];
        } catch(e) { console.log('Reset'); }

        // RENDER LOOP
        setInterval(() => {
            const now = Date.now();
            let saveNeeded = false;
            game.inventory.forEach(item => {
                if(item.category==='food' && !item.isSpoiled && now > item.expireTime) {
                    item.isSpoiled = true; saveNeeded = true;
                }
            });
            if(saveNeeded) { save(); render(); }
            if(document.getElementById('tab-inv').classList.contains('active')) renderGrid();
            
            // Оновлюємо кнопки магазину (якщо раптом гроші змінилися, щоб кнопка стала активною/неактивною)
            if(document.getElementById('tab-shop').classList.contains('active')) renderShop();
        }, 1000);

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;

            const pc = game.inventory.find(i => i.id === 'pc');
            const bed = game.inventory.find(i => i.id === 'bed');
            
            const pcEl = document.getElementById('item-pc');
            if(pc) { pcEl.style.display='block'; pcEl.className = pc.hp<=0?'room-item broken-visual':'room-item'; } else { pcEl.style.display='none'; }
            
            const bedEl = document.getElementById('item-bed');
            if(bed) { bedEl.style.display='block'; bedEl.className = bed.hp<=0?'room-item broken-visual':'room-item'; } else { bedEl.style.display='none'; }
        }

        // RENDER SHOP (НОВА ФУНКЦІЯ)
        function renderShop() {
            const container = document.getElementById('shop-grid');
            // Перемальовуємо тільки якщо змінилась кількість (оптимізація)
            // Але для простоти зараз просто оновимо статус кнопок
            
            if(container.innerHTML === "") { // Перший рендер
                shopItems.forEach(item => {
                    let specsHTML = item.specs.map(s => {
                        let colorClass = s.includes('Енергії') ? 'spec-blue' : (s.includes('Термін') ? 'spec-orange' : 'spec-green');
                        return `<div class="spec-pill ${colorClass}">${s}</div>`;
                    }).join('');

                    container.innerHTML += `
                    <div class="shop-card">
                        <div class="poster-visual">${item.icon}</div>
                        <div class="poster-info">
                            <div class="poster-title">${item.name}</div>
                            <div class="poster-desc">${item.desc}</div>
                            <div class="specs-row">${specsHTML}</div>
                            <button class="buy-btn" id="btn-buy-${item.id}" onclick="buy('${item.id}')">
                                <span>Купити</span> <span>${item.price}$</span>
                            </button>
                        </div>
                    </div>`;
                });
            }

            // Оновлюємо кнопки (активна/неактивна)
            shopItems.forEach(item => {
                const btn = document.getElementById(`btn-buy-${item.id}`);
                if(btn) {
                    const hasItem = game.inventory.some(i => i.id === item.id);
                    if(hasItem) {
                        btn.style.background = "#333";
                        btn.style.color = "#777";
                        btn.innerHTML = "<span>Вже є</span>";
                        btn.disabled = true;
                    } else if (game.money >= item.price) {
                        btn.style.background = "var(--accent)";
                        btn.style.color = "white";
                        btn.disabled = false;
                    } else {
                        btn.style.background = "#333";
                        btn.style.color = "#777";
                        btn.disabled = true;
                    }
                    
                    // Їжу можна купувати завжди
                    if(item.type === 'food') {
                         if (game.money >= item.price) {
                            btn.style.background = "var(--accent)";
                            btn.innerHTML = `<span>Купити</span> <span>${item.price}$</span>`;
                            btn.style.color = "white";
                            btn.disabled = false;
                         } else {
                            btn.style.background = "#333";
                            btn.disabled = true;
                         }
                    }
                }
            });
        }

        // RENDER INVENTORY
        function renderGrid() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";
            const now = Date.now();

            if(game.inventory.length === 0) {
                grid.innerHTML = "<div style='grid-column:1/-1;text-align:center;color:#555;'>Пусто</div>";
                return;
            }

            game.inventory.forEach((item, index) => {
                let emoji = "📦", color = "#30d158", badge = "", offset = 0;
                
                if(item.category === 'device') {
                    const meta = shopItems.find(x => x.id === item.id);
                    emoji = meta ? meta.icon : "📦";
                    
                    if(item.hp <= 0) { color="#ff453a"; badge="ЗЛАМ."; offset=200; }
                    else { 
                        if(item.hp < 50) color="#ff9f0a";
                        badge = item.hp + "%"; 
                        offset = 200 - (200 * item.hp / 100);
                    }
                }
                if(item.category === 'food') {
                    const meta = shopItems.find(x => x.id === item.id);
                    emoji = meta ? meta.icon : "🍔";

                    if(item.isSpoiled) { emoji="🤢"; color="#555"; badge="🗑️"; offset=200; }
                    else {
                        const maxTime = item.totalLife;
                        const left = Math.max(0, item.expireTime - now);
                        badge = Math.ceil(left/1000)+"с";
                        color = "#0a84ff";
                        offset = 200 - (200 * (left/maxTime));
                    }
                }

                grid.innerHTML += `
                <div class="app-card" onclick="openSheet(${index})">
                    <div class="icon-wrapper">
                        <div class="app-bg"><span class="app-emoji">${emoji}</span></div>
                        <svg class="progress-svg" viewBox="0 0 72 72">
                            <rect class="progress-ring" x="4" y="4" width="64" height="64" rx="14" stroke="${color}" stroke-dasharray="200" stroke-dashoffset="${offset}" />
                        </svg>
                        <div class="app-badge">${badge}</div>
                    </div>
                    <div class="app-label">${item.name}</div>
                </div>`;
            });
        }

        // LOGIC
        function buy(id) {
            const meta = shopItems.find(x => x.id === id);
            if(game.money < meta.price) return alert("Нема грошей");

            if(meta.type === 'device') {
                if(game.inventory.some(i => i.id === id)) return alert("Вже є!");
                game.inventory.push({id: meta.id, name: meta.name, category: 'device', hp: 100});
            } else {
                // Food
                let lifeTime = id === 'pizza' ? 30000 : 20000;
                game.inventory.push({
                    id: meta.id, name: meta.name, category: 'food', 
                    expireTime: Date.now() + lifeTime, totalLife: lifeTime, isSpoiled: false
                });
            }
            game.money -= meta.price;
            save(); render(); renderShop();
        }

        // ANIMATIONS & ACTIONS
        let isBusy = false;
        function animateBtn(btn, dur) {
            const ring = btn.querySelector('.progress-ring');
            const badge = btn.querySelector('.app-badge');
            const start = Date.now();
            const int = setInterval(() => {
                const passed = Date.now() - start;
                const left = Math.max(0, dur - passed);
                ring.style.strokeDashoffset = 200 - (200 * (left/dur));
                badge.innerText = (left/1000).toFixed(1) + 'с';
                if(left<=0) { clearInterval(int); badge.innerText = "3с"; ring.style.strokeDashoffset = 0; }
            }, 30);
        }

        function runSceneAction(icon, text, btn, cb) {
            if(isBusy) return; isBusy = true;
            if(btn) animateBtn(btn, 3000);
            const ov = document.getElementById('scene-overlay');
            document.getElementById('overlay-icon').innerText = icon;
            document.getElementByI
