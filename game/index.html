<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim: App Grid</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #7b61ff; --text: #fff; --red: #ff4757; --green: #2ecc71; --yellow: #f1c40f; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 90px; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* СЦЕНА */
        .scene-container { position: relative; width: 100%; height: 240px; background-color: #333; border-bottom: 8px solid #555; overflow: hidden; }
        #visual-hero { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 70px; z-index: 10; }
        .room-item { position: absolute; font-size: 45px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 35px; }
        #item-bed { left: 30px; bottom: 35px; }
        .broken-visual { filter: grayscale(1) brightness(0.7); transform: rotate(5deg); }

        /* UI */
        .ui { padding: 15px; }
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #333; }
        .money { color: var(--green); font-weight: 800; font-size: 20px; }

        .btn { background: var(--card); color: white; border: 1px solid #333; padding: 15px; width: 100%; margin-bottom: 10px; border-radius: 16px; display: flex; align-items: center; gap: 15px; cursor: pointer; text-align: left; transition: transform 0.1s;}
        .btn:active { transform: scale(0.98); background: #2a2a2a; }
        .btn-icon { font-size: 24px; color: var(--accent); background: rgba(255,255,255,0.05); padding: 8px; border-radius: 12px; }
        .section-title { font-size: 12px; color: #888; margin: 15px 0 5px 0; text-transform: uppercase; }

        /* --- НОВИЙ ДИЗАЙН ІНВЕНТАРЮ (APP GRID) --- */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 в ряд */
            gap: 15px;
            padding: 10px 0;
        }

        /* Картка "Застосунок" */
        .app-card {
            display: flex; flex-direction: column; align-items: center; cursor: pointer;
        }
        
        /* Іконка (Квадрат) */
        .app-icon-square {
            width: 70px; height: 70px;
            background: var(--card);
            border-radius: 18px; /* Закруглені кути як в iOS/Android */
            display: flex; justify-content: center; align-items: center;
            position: relative;
            border: 3px solid #333; /* Базова рамка */
            transition: transform 0.1s, border-color 0.3s;
        }
        .app-card:active .app-icon-square { transform: scale(0.92); }
        .app-emoji { font-size: 32px; }

        /* Підпис під іконкою */
        .app-label {
            font-size: 11px; color: #aaa; margin-top: 6px; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
        }

        /* СТАНИ (Кольорові рамки) */
        .status-good { border-color: var(--green) !important; }
        .status-warn { border-color: var(--yellow) !important; }
        .status-bad { border-color: var(--red) !important; }
        .status-spoiled { 
            border-color: #555 !important; background: #2a0e0e !important; /* Темно-червоний фон */
            filter: grayscale(0.6);
        }

        /* БЕЙДЖИК (Куток з цифрою) */
        .app-badge {
            position: absolute; bottom: -5px; right: -5px;
            background: #333; color: white; font-size: 10px; font-weight: bold;
            padding: 3px 6px; border-radius: 10px; border: 2px solid var(--bg);
        }
        .badge-good { background: var(--green); color: black; }
        .badge-warn { background: var(--yellow); color: black; }
        .badge-bad { background: var(--red); }

        /* TABS & NAV */
        .tab { display: none; } .tab.active { display: block; animation: fadeUp 0.2s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(18,18,18,0.95); backdrop-filter: blur(10px); display: flex; padding: 15px 0; border-top: 1px solid #333; z-index: 300; }
        .nav-btn { flex: 1; background: none; border: none; font-size: 24px; color: #555; transition: color 0.2s; cursor: pointer;}
        .nav-btn.active { color: var(--accent); }
        
        /* Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999; color: white; flex-direction: column; backdrop-filter: blur(5px); }
        .overlay-emoji { font-size: 80px; animation: pulse 1s infinite alternate;}
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="overlay"><div class="overlay-emoji" id="overlay-emoji">🍔</div><h2 id="overlay-text">...</h2></div>

    <div class="scene-container">
        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="header">
            <div>💵 <span id="money">0</span></div>
            <div>⚡ <span id="energy">100</span>% ❤️ <span id="health">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <div class="section-title">Основне</div>
            <button class="btn" onclick="work()">
                <div class="btn-icon"><i class="ri-macbook-line"></i></div>
                <div><b>Фріланс</b><br><small>+15$ | -10 Енергії | Знос ПК</small></div>
            </button>
            <button class="btn" onclick="sleep()">
                <div class="btn-icon"><i class="ri-hotel-bed-line"></i></div>
                <div><b>Сон</b><br><small>+20 Енергії | Знос ліжка</small></div>
            </button>
        </div>

        <div id="tab-inv" class="tab">
            <div class="section-title">Мої додатки (Речі)</div>
            <div id="inventory-grid" class="inventory-grid">
                </div>
        </div>

        <div id="tab-shop" class="tab">
             <div class="section-title">Техніка</div>
            <button class="btn" onclick="buyItem('pc', 150)">
                <div class="btn-icon"><i class="ri-computer-line"></i></div>
                <div><b>ПК</b> (150$)<br><small>Для роботи</small></div>
            </button>
            <button class="btn" onclick="buyItem('bed', 100)">
                <div class="btn-icon"><i class="ri-home-heart-line"></i></div>
                <div><b>Ліжко</b> (100$)<br><small>Для сну</small></div>
            </button>
             <div class="section-title">Їжа (Псується!)</div>
            <button class="btn" onclick="buyFood('pizza', 20)">
                <div class="btn-icon">🍕</div>
                <div><b>Піца</b> (20$)<br><small>Термін: 30 сек</small></div>
            </button>
            <button class="btn" onclick="buyFood('sushi', 35)">
                <div class="btn-icon">🍣</div>
                <div><b>Суші</b> (35$)<br><small>Термін: 15 сек</small></div>
            </button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="ri-home-5-line"></i></button>
        <button class="nav-btn" onclick="switchTab('inv', this)"><i class="ri-apps-2-line"></i></button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><i class="ri-shopping-cart-2-line"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let game = {
            money: 300, energy: 100, health: 100,
            inventory: [] 
        };

        if(localStorage.getItem('simGrid')) game = JSON.parse(localStorage.getItem('simGrid'));

        // --- ЛОГІКА ПСУВАННЯ ---
        setInterval(() => {
            let needsRender = false;
            const now = Date.now();
            game.inventory.forEach(item => {
                if (item.category === 'food' && !item.isSpoiled && now > item.expireTime) {
                    item.isSpoiled = true;
                    tg.HapticFeedback.notificationOccurred('warning');
                    needsRender = true;
                }
            });
            if(needsRender) { render(); save(); }
            
            // Постійне оновлення інвентарю (для таймерів)
            if(document.getElementById('tab-inv').classList.contains('active')) {
                renderInventoryGrid();
            }
        }, 1000);

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;
            document.getElementById('health').innerText = game.health;

            const pc = game.inventory.find(i => i.id === 'pc');
            const bed = game.inventory.find(i => i.id === 'bed');
            
            const pcEl = document.getElementById('item-pc');
            const bedEl = document.getElementById('item-bed');

            pcEl.style.display = pc ? 'block' : 'none';
            if(pc) pcEl.className = pc.hp <= 0 ? 'room-item broken-visual' : 'room-item';
            
            bedEl.style.display = bed ? 'block' : 'none';
            if(bed) bedEl.className = bed.hp <= 0 ? 'room-item broken-visual' : 'room-item';
        }

        // --- НОВИЙ РЕНДЕР ІНВЕНТАРЮ (ГРІД) ---
        function renderInventoryGrid() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";
            const now = Date.now();

            if (game.inventory.length === 0) {
                grid.innerHTML = "<div style='grid-column:1/-1; text-align:center;color:gray; padding:20px;'>Пусто</div>";
                return;
            }

            game.inventory.forEach((item, index) => {
                let emoji = "📦";
                let statusClass = "";
                let badgeHTML = "";
                let label = item.name;
                let action = "";

                // Логіка для Техніки
                if (item.category === 'device') {
                    if (item.id === 'pc') emoji = "🖥️";
                    if (item.id === 'bed') emoji = "🛏️";

                    if (item.hp > 50) { statusClass = "status-good"; badgeHTML = `<span class="app-badge badge-good">${item.hp}%</span>`; }
                    else if (item.hp > 0) { statusClass = "status-warn"; badgeHTML = `<span class="app-badge badge-warn">${item.hp}%</span>`; }
                    else { statusClass = "status-bad"; badgeHTML = `<span class="app-badge badge-bad">ЗЛАМ.</span>`; label = "Зламано"; }
                    
                    action = `onclick="repair(${index})"`;
                }

                // Логіка для Їжі
                if (item.category === 'food') {
                    if (item.id === 'pizza') emoji = "🍕";
                    if (item.id === 'sushi') emoji = "🍣";

                    if (item.isSpoiled) {
                        emoji = "🤢";
                        statusClass = "status-spoiled";
                        label = "Сміття";
                        action = `onclick="trash(${index})"`;
                    } else {
                        const timeLeft = Math.max(0, Math.ceil((item.expireTime - now)/1000));
                        statusClass = timeLeft > 10 ? "status-good" : "status-warn";
                        // Бейдж з таймером
                        badgeHTML = `<span class="app-badge ${timeLeft > 10 ? 'badge-good' : 'badge-warn'}">${timeLeft}с</span>`;
                        action = `onclick="eat(${index})"`;
                    }
                }

                grid.innerHTML += `
                <div class="app-card" ${action}>
                    <div class="app-icon-square ${statusClass}">
                        <span class="app-emoji">${emoji}</span>
                        ${badgeHTML}
                    </div>
                    <div class="app-label">${label}</div>
                </div>
                `;
            });
        }

        // --- ACTIONS ---
        function work() {
            const pc = game.inventory.find(i => i.id === 'pc');
            if (!pc || pc.hp <= 0) return tg.showAlert("Потрібен робочий ПК!");
            if (game.energy < 10) return tg.showAlert("Втомився!");
            
            showOverlay("👨‍💻", "КОДИНГ...");
            setTimeout(() => {
                game.money += 15; game.energy -= 10;
                pc.hp -= 20; // Швидший знос для тесту
                finishAction();
            }, 2000);
        }

        function sleep() {
            const bed = game.inventory.find(i => i.id === 'bed');
            if (!bed || bed.hp <= 0) return tg.showAlert("Потрібне ціле ліжко!");
            
            showOverlay("😴", "СОН...");
            setTimeout(() => {
                game.energy = Math.min(100, game.energy + 20);
                bed.hp -= 10;
                finishAction();
            }, 2000);
        }

        function showOverlay(emoji, text) {
            document.getElementById('overlay-emoji').innerText = emoji;
            document.getElementById('overlay-text').innerText = text;
            document.getElementById('overlay').style.display = 'flex';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function finishAction() {
            document.getElementById('overlay').style.display = 'none';
            save(); render();
        }

        // --- SHOP & INVENTORY ---
        function buyItem(id, price) {
            if (game.inventory.some(i => i.id === id)) return tg.showAlert("Вже є!");
            if (game.money < price) return tg.showAlert("Нема грошей");
            
            game.money -= price;
            game.inventory.push({
                id: id, name: id === 'pc' ? 'ПК' : 'Ліжко',
                category: 'device', hp: 100
            });
            save(); render(); tg.showAlert("Куплено!");
            tg.HapticFeedback.notificationOccurred('success');
        }

        function buyFood(type, price) {
            if (game.money < price) return tg.showAlert("Нема грошей");
            game.money -= price;
            let lifeSeconds = type === 'pizza' ? 30 : 15; 
            game.inventory.push({
                id: type, name: type === 'pizza' ? 'Піца' : 'Суші', category: 'food',
                expireTime: Date.now() + (lifeSeconds * 1000), isSpoiled: false
            });
            save(); render(); tg.showAlert("Куплено! Їж швидше!");
            tg.HapticFeedback.notificationOccurred('success');
        }

        function eat(index) {
            game.inventory.splice(index, 1);
            game.energy = Math.min(100, game.energy + 20);
            game.health = Math.min(100, game.health + 5);
            tg.showAlert("Смачно! +Енергія");
            tg.HapticFeedback.impactOccurred('light');
            save(); render(); renderInventoryGrid();
        }

        function trash(index) {
            game.inventory.splice(index, 1);
            tg.showAlert("Викинуто.");
            tg.HapticFeedback.impactOccurred('heavy');
            save(); render(); renderInventoryGrid();
        }

        function repair(index) {
            const item = game.inventory[index];
            if(item.hp >= 100) return tg.showAlert("Ще ціле.");
            if(game.money < 50) return tg.showAlert("Треба 50$");
            game.money -= 50;
            item.hp = 100;
            tg.showAlert("Відремонтовано!");
            tg.HapticFeedback.notificationOccurred('success');
            save(); render(); renderInventoryGrid();
        }

        // NAV
        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'inv') renderInventoryGrid();
            tg.HapticFeedback.selectionChanged();
        }

        function save() { localStorage.setItem('simGrid', JSON.stringify(game)); }
        render();

    </script>
</body>
</html>
