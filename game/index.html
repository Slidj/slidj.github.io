<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real-Time Life</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --green: #00b894; --text: #fff; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: sans-serif; user-select: none; }
        
        /* Головний таймер */
        #active-task-panel {
            display: none; /* Приховано, коли нічого не робиш */
            background: #2d3436; border: 2px solid #0984e3;
            padding: 20px; border-radius: 16px; margin-bottom: 20px;
            text-align: center;
        }
        .timer-big { font-size: 48px; font-weight: bold; font-variant-numeric: tabular-nums; }
        .task-name { color: #aaa; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
        
        /* Звичайна статистика */
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .money { background: var(--green); color: #000; padding: 5px 15px; border-radius: 15px; font-weight: bold; }
        
        /* Кнопки */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button {
            background: var(--card); color: white; border: 1px solid #333;
            padding: 20px; border-radius: 12px; font-size: 16px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        button:disabled { opacity: 0.3; filter: grayscale(100%); cursor: not-allowed; }
        button:active { transform: scale(0.98); }
        .duration { font-size: 12px; color: #888; }
        
        /* Індикатор прогресу */
        .progress-bar { height: 6px; background: #444; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: #0984e3; width: 0%; transition: width 1s linear; }
    </style>
</head>
<body>

    <div class="header">
        <div>Мій Статус: <b id="status">Вільний</b></div>
        <div class="money"><span id="money">0</span> $</div>
    </div>

    <div id="active-task-panel">
        <div class="task-name" id="task-title">Працюю...</div>
        <div class="timer-big" id="timer-display">00:00</div>
        <div class="progress-bar"><div class="progress-fill" id="timer-bar"></div></div>
        <div style="margin-top:10px; font-size:12px; color:#666;">Можна згорнути додаток</div>
    </div>

    <div class="actions" id="buttons-container">
        
        <button onclick="startAction('work_fast')">
            <span>⚡ Фріланс</span>
            <span class="duration">10 секунд (Тест)</span>
            <span style="color:var(--green)">+10$</span>
        </button>

        <button onclick="startAction('work_hard')">
            <span>🏢 Офіс</span>
            <span class="duration">1 Година (Реал)</span>
            <span style="color:var(--green)">+150$</span>
        </button>

        <button onclick="startAction('gym')">
            <span>🏋️ Спортзал</span>
            <span class="duration">30 хвилин</span>
            <span style="color:#fdcb6e">+Сила</span>
        </button>

        <button onclick="startAction('sleep')">
            <span>😴 Спати</span>
            <span class="duration">8 годин</span>
            <span style="color:#74b9ff">Відновлення</span>
        </button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Стан гри
        let game = {
            money: 0,
            busyUntil: 0, // Timestamp: коли закінчиться дія (0 якщо вільний)
            currentTask: null // Назва дії
        };

        // Завантаження збереження
        function loadGame() {
            const saved = localStorage.getItem('lifeSimSave');
            if (saved) {
                game = JSON.parse(saved);
                updateUI();
                checkTimer(); // Одразу перевіряємо, чи не пройшов час поки нас не було
            }
        }

        // Збереження гри
        function saveGame() {
            localStorage.setItem('lifeSimSave', JSON.stringify(game));
        }

        // --- ГОЛОВНА ЛОГІКА ТАЙМЕРА ---
        
        function startAction(type) {
            let durationSeconds = 0;
            let title = "";

            // НАЛАШТУВАННЯ ЧАСУ (в секундах)
            if (type === 'work_fast') { durationSeconds = 10; title = "Швидке замовлення"; }
            if (type === 'work_hard') { durationSeconds = 3600; title = "Робота в офісі"; } // 1 година
            if (type === 'gym')       { durationSeconds = 1800; title = "Тренування"; }      // 30 хв
            if (type === 'sleep')     { durationSeconds = 28800; title = "Сон"; }            // 8 годин

            // Встановлюємо час закінчення
            const now = Date.now();
            game.busyUntil = now + (durationSeconds * 1000);
            game.currentTask = type;
            game.taskName = title;
            game.totalDuration = durationSeconds; // Запам'ятовуємо, щоб малювати прогрес-бар
            
            saveGame();
            updateUI();
            checkTimer(); // Запускаємо цокання
        }

        function checkTimer() {
            const now = Date.now();

            if (game.busyUntil > now) {
                // Дія ще триває
                const leftInfo = getTimeLeft(game.busyUntil);
                document.getElementById('timer-display').innerText = leftInfo.text;
                document.getElementById('task-title').innerText = game.taskName;
                
                // Прогрес бар
                const elapsed = (game.totalDuration * 1000) - (game.busyUntil - now);
                const percent = (elapsed / (game.totalDuration * 1000)) * 100;
                document.getElementById('timer-bar').style.width = percent + '%';

                // Запускаємо наступний кадр перевірки
                requestAnimationFrame(checkTimer);
            } 
            else if (game.busyUntil !== 0) {
                // Дія ЗАВЕРШИЛАСЬ саме зараз (або поки нас не було)
                finishAction();
            }
        }

        function finishAction() {
            // Видаємо нагороду
            if (game.currentTask === 'work_fast') { game.money += 10; tg.showAlert("Замовлення готове! +10$"); }
            if (game.currentTask === 'work_hard') { game.money += 150; tg.showAlert("Робочий день закінчено! +150$"); }
            if (game.currentTask === 'gym')       { tg.showAlert("Ти став сильнішим! 💪"); }
            if (game.currentTask === 'sleep')     { tg.showAlert("Ти виспався! ☀️"); }

            // Скидаємо таймер
            game.busyUntil = 0;
            game.currentTask = null;
            saveGame();
            updateUI();
        }

        // Форматування часу (01:05:20)
        function getTimeLeft(endTime) {
            const totalSeconds = Math.floor((endTime - Date.now()) / 1000);
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            
            // Красивий формат 00:00:00
            const text = 
                (h > 0 ? h + ":" : "") + 
                (m < 10 ? "0" + m : m) + ":" + 
                (s < 10 ? "0" + s : s);
            
            return { text, totalSeconds };
        }

        function updateUI() {
            document.getElementById('money').innerText = game.money;

            const isBusy = game.busyUntil > Date.now();
            
            // Показуємо або ховаємо панель таймера
            document.getElementById('active-task-panel').style.display = isBusy ? 'block' : 'none';
            document.getElementById('status').innerText = isBusy ? 'Зайнятий' : 'Вільний';

            // Блокуємо кнопки, якщо зайняті
            const buttons = document.querySelectorAll('#buttons-container button');
            buttons.forEach(btn => btn.disabled = isBusy);
        }

        // Старт
        loadGame();
    </script>
</body>
</html>
