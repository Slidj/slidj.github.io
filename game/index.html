<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub (Stable)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР */
        #player-area { 
            display: none; 
            position: sticky; top: 0; background: #000; z-index: 100; 
            width: 100%; border-bottom: 2px solid #333;
        }
        .iframe-container {
            position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000;
        }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        
        .control-bar { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; }
        .btn-close { 
            background: #d32f2f; color: white; border: none; 
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* СПИСОК */
        .header { padding: 15px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #1e1e1e; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
        }
        .card:active { opacity: 0.8; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 12px; }
        .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .sub { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="iframe-container">
            <div id="player-placeholder"></div>
        </div>
        <div class="control-bar">
            <span>YouTube Official</span>
            <button class="btn-close" onclick="closePlayer()">ЗАКРИТИ</button>
        </div>
    </div>

    <div class="header">Тренди (Стабільна версія)</div>
    <div id="list" class="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Статичний список найкращих відео для тесту
        const VIDEOS = [
            { id: "LXb3EKWsInQ", title: "Природа 4K HDR", author: "Jacob + Katie Schwarz", img: "https://i.ytimg.com/vi/LXb3EKWsInQ/hqdefault.jpg" },
            { id: "jfKfPfyJRdk", title: "Lofi Girl - Radio", author: "Lofi Girl", img: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
            { id: "5qap5aO4i9A", title: "Lofi Hip Hop - Beats to Relax", author: "Lofi Girl", img: "https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg" },
            { id: "aqz-KE-bpKQ", title: "Big Buck Bunny", author: "Blender", img: "https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg" }
        ];

        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');

        function init() {
            listEl.innerHTML = '';
            VIDEOS.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="thumb-wrapper"><img class="thumb" src="${v.img}"></div>
                    <div class="info"><div class="title">${v.title}</div><div class="sub">${v.author}</div></div>
                `;
                el.onclick = () => playVideo(v.id);
                listEl.appendChild(el);
            });
        }

        function playVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            
            // Офіційний Iframe. Це працюватиме завжди.
            placeholder.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function closePlayer() {
            placeholder.innerHTML = ''; 
            playerArea.style.display = 'none';
        }

        init();
    </script>
</body>
</html>
