<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* --- PRO MOBILE STYLE --- */
        :root {
            --bg-color: #11131a;     
            --card-bg: #1c1f28;      
            --text-primary: #e0e3eb; 
            --text-secondary: #7e8798; 
            --accent-green: #2ebd85; 
            --accent-red: #f6465d;   
            --btn-radius: 14px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* HEADER - ВИПРАВЛЕНО ВІДСТУП */
        .header {
            padding: 0 16px;
            
            /* --- ПОВЕРНУЛИ ВЕЛИКИЙ ВІДСТУП --- */
            padding-top: 70px; 
            padding-top: calc(70px + env(safe-area-inset-top));
            
            padding-bottom: 10px; /* Трохи місця знизу */
            background: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            min-height: 60px; /* Дозволяємо хедеру розтягуватись */
        }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--card-bg); object-fit: cover;
            border: 2px solid var(--card-bg);
        }
        .user-info { display: flex; flex-direction: column; justify-content: center; }
        .user-name { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; color: #fff; }
        .balance { font-size: 13px; color: #fab005; font-weight: 600; margin-top: 2px; }

        .market-controls { display: flex; flex-direction: column; align-items: flex-end; }
        
        /* Стильний селект валют */
        .asset-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); padding: 6px 10px; border-radius: 10px;
        }
        #asset-select {
            background: transparent; color: var(--text-primary); border: none;
            font-weight: 700; font-size: 14px; outline: none; appearance: none;
        }
        .settings-icon { width: 18px; height: 18px; fill: var(--text-secondary); }

        .price { font-size: 17px; font-weight: 700; font-family: 'SF Mono', 'Roboto Mono', monospace; margin-top: 4px; }

        /* CHART CONTAINER */
        #chart-container { 
            flex-grow: 1; 
            width: 100%; 
            position: relative; 
            background: var(--bg-color);
        }

        /* CONTROLS */
        .controls {
            padding: 16px 16px 40px 16px; /* 40px знизу для iPhone Home bar */
            background: var(--bg-color);
            display: flex; gap: 12px;
        }
        .btn {
            flex: 1; height: 58px; border: none; border-radius: var(--btn-radius);
            font-size: 18px; font-weight: 700; color: white; cursor: pointer;
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-up { background: var(--accent-green); box-shadow: 0 4px 20px rgba(46, 189, 133, 0.25); }
        .btn-down { background: var(--accent-red); box-shadow: 0 4px 20px rgba(246, 70, 93, 0.25); }

        /* MODALS */
        .modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #252a33; padding: 24px; border-radius: 20px;
            width: 280px; text-align: center; opacity: 0; pointer-events: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        
        .settings-row { margin-bottom: 24px; text-align: left; }
        .settings-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 10px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Modern Slider */
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #363c4e; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: white; margin-top: -8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .loader { border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--text-primary); border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'%3E%3Crect width='24' height='24' fill='%23333'/%3E%3C/svg%3E" class="user-avatar">
            <div class="user-info">
                <div id="user-name" class="user-name">Trader</div>
                <div class="balance" id="balance">$1,000</div>
            </div>
        </div>
        
        <div class="market-controls">
            <div class="asset-wrapper" onclick="toggleSettings()">
                <select id="asset-select" onclick="event.stopPropagation()">
                    <option value="btcusdt">BTC / USDT</option>
                    <option value="ethusdt">ETH / USDT</option>
                    <option value="solusdt">SOL / USDT</option>
                    <option value="dogeusdt">DOGE / USDT</option>
                </select>
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </div>
            <div class="price" id="price">Loading...</div>
        </div>
    </div>

    <div id="chart-container"></div>

    <div id="result-popup" class="modal">
        <div id="result-title" style="font-weight: 800; font-size: 22px; margin-bottom: 5px;">RESULT</div>
        <div id="result-amount" style="font-size: 32px; font-weight: 900; color: white;">$0</div>
    </div>

    <div id="settings-popup" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; color:white;">Налаштування</h3>
            <span onclick="toggleSettings()" style="font-size:24px; cursor:pointer; color: #fff;">&times;</span>
        </div>
        
        <div class="settings-row">
            <label class="settings-label">Масштаб (Zoom)</label>
            <input type="range" id="zoom-slider" min="5" max="25" value="12" step="1">
        </div>

        <div class="settings-row">
            <label class="settings-label">Розмір шрифту</label>
            <input type="range" id="font-slider" min="10" max="16" value="14" step="1">
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-up" onclick="startTrade('UP')">
            <span>↑</span> CALL
        </button>
        <button class="btn btn-down" onclick="startTrade('DOWN')">
            <span>↓</span> PUT
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#11131a'); 

        // --- 1. PRO CONFIG ---
        const CONFIG = {
            bg: '#11131a',       
            grid: '#1c1f28',     
            text: '#7e8798',     
            up: '#2ebd85',       
            down: '#f6465d',     
        };

        // --- 2. CHART SETUP ---
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { 
                background: { type: 'solid', color: CONFIG.bg }, 
                textColor: CONFIG.text, 
                fontSize: 14, 
                fontFamily: "-apple-system, BlinkMacSystemFont, Roboto, sans-serif"
            },
            grid: { vertLines: { color: CONFIG.grid }, horzLines: { color: CONFIG.grid } },
            rightPriceScale: { borderColor: 'transparent' },
            timeScale: { borderColor: 'transparent', timeVisible: true, secondsVisible: false, barSpacing: 12 },
            crosshair: {
                mode: 1, 
                vertLine: { style: 2, color: '#505668', labelBackgroundColor: '#505668' },
                horzLine: { style: 2, color: '#505668', labelBackgroundColor: '#505668' }
            }
        });

        let series = chart.addCandlestickSeries({
            upColor: CONFIG.up, borderUpColor: CONFIG.up, wickUpColor: CONFIG.up,
            downColor: CONFIG.down, borderDownColor: CONFIG.down, wickDownColor: CONFIG.down,
            priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
        });

        window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);

        // --- 3. LOGIC ---
        function toggleSettings() {
            document.getElementById('settings-popup').classList.toggle('show');
        }

        document.getElementById('zoom-slider').addEventListener('input', (e) => {
            chart.timeScale().applyOptions({ barSpacing: parseFloat(e.target.value) });
        });
        document.getElementById('font-slider').addEventListener('input', (e) => {
            chart.applyOptions({ layout: { fontSize: parseInt(e.target.value) } });
        });

        // --- 4. DATA FEED ---
        let ws = null;
        let currentPrice = 0;
        const priceLabel = document.getElementById('price');
        const assetSelect = document.getElementById('asset-select');

        function connectWebSocket(symbol) {
            if (ws) ws.close();
            series.setData([]);
            priceLabel.innerHTML = '<span class="loader"></span>';

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@kline_1s`);
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const k = message.k;
                const candle = {
                    time: k.t / 1000,
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c),
                };
                currentPrice = candle.close;
                
                const color = !window.lastPrice || currentPrice >= window.lastPrice ? CONFIG.up : CONFIG.down;
                priceLabel.style.color = color;
                window.lastPrice = currentPrice;
                
                const digits = currentPrice < 1 ? 5 : 2;
                series.applyOptions({ priceFormat: { precision: digits, minMove: 1 / Math.pow(10, digits) } });
                
                priceLabel.innerText = currentPrice.toFixed(digits);
                series.update(candle);
            };
        }

        assetSelect.addEventListener('change', (e) => connectWebSocket(e.target.value));
        connectWebSocket('btcusdt');

        // --- 5. USER INFO ---
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;
        }

        // --- 6. TRADING ENGINE ---
        let balance = 1000;
        let isTrading = false;
        let betLine = null;

        function startTrade(direction) {
            if (isTrading) return;
            isTrading = true;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');

            const entryPrice = currentPrice;
            const betAmount = 50;
            const lineColor = direction === 'UP' ? CONFIG.up : CONFIG.down;

            betLine = series.createPriceLine({
                price: entryPrice, color: lineColor, lineWidth: 2, lineStyle: 2,
                title: direction.toUpperCase(), axisLabelVisible: true
            });

            setTimeout(() => { finishTrade(direction, entryPrice, betAmount); }, 3000);
        }

        function finishTrade(direction, entryPrice, betAmount) {
            let win = false;
            if (direction === 'UP' && currentPrice > entryPrice) win = true;
            else if (direction === 'DOWN' && currentPrice < entryPrice) win = true;

            if (win) balance += betAmount * 0.8; else balance -= betAmount;

            document.getElementById('balance').innerText = `$${balance.toFixed(0)}`;
            if (betLine) { series.removePriceLine(betLine); betLine = null; }

            const popup = document.getElementById('result-popup');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');

            title.innerText = win ? 'PROFIT' : 'LOSS';
            title.style.color = win ? CONFIG.up : CONFIG.down;
            amount.innerText = win ? `+$${(betAmount * 0.8).toFixed(0)}` : `-$${betAmount}`;
            popup.style.borderColor = win ? CONFIG.up : CONFIG.down;
            
            popup.classList.add('show');
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
            
            setTimeout(() => { popup.classList.remove('show'); isTrading = false; }, 2000);
        }
    </script>
</body>
</html>
