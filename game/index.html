<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival RPG</title>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; }
        #game-container { width: 100vw; height: 100vh; }
        
        /* Стиль кнопки Дії */
        #action-btn {
            position: fixed;
            bottom: 50px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.5); /* Напівпрозора червона */
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            user-select: none;
            cursor: pointer;
            z-index: 100;
        }
        #action-btn:active { background: rgba(255, 0, 0, 0.8); transform: scale(0.95); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="action-btn">⛏️</div>

    <script src="game.js"></script>
</body>
</html>
