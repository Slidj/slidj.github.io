<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diablo Style RPG</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #050505; overflow: hidden; touch-action: none; 
            font-family: 'Times New Roman', serif; /* Шрифт під старовину */
        }
        #game-container { width: 100vw; height: 100vh; }
        
        /* Кнопка Атаки (Стиль Diablo) */
        #action-btn {
            position: fixed; bottom: 40px; right: 40px;
            width: 90px; height: 90px;
            background: radial-gradient(circle, #8b0000 0%, #300000 100%); /* Криваво-червоний */
            border-radius: 50%; 
            border: 4px solid #c0c0c0; /* Срібна рамка */
            box-shadow: 0 0 15px #ff0000;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #ffaaaa; cursor: pointer; z-index: 100;
        }
        #action-btn:active { transform: scale(0.95); box-shadow: 0 0 5px #ff0000; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="action-btn">⚔️</div>
    
    <script src="game.js?v=20"></script> 
</body>
</html>
