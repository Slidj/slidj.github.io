<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim</title>
    <style>
        /* touch-action: none - ВАЖЛИВО для джойстика */
        body { 
            margin: 0; padding: 0; background: #111; overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #game-container { width: 100vw; height: 100vh; }
        
        /* UI Статистика */
        #ui-layer {
            position: fixed; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 10px; pointer-events: none; z-index: 10;
        }
        .stat-box {
            background: rgba(0,0,0,0.8); color: white; padding: 5px 10px;
            border-radius: 8px; flex: 1; border: 1px solid #555; font-size: 12px;
        }
        .bar-container {
            width: 100%; height: 6px; background: #333; margin-top: 5px; border-radius: 3px;
        }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        #energy-fill { background: #ffcc00; width: 100%; }
        #hunger-fill { background: #ff4444; width: 100%; }

        /* Гроші */
        #money-box {
            position: fixed; top: 50px; right: 10px;
            background: #28a745; color: white; padding: 5px 10px;
            border-radius: 15px; font-weight: bold; border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10;
        }

        /* Кнопка дії */
        #interact-btn {
            display: none;
            position: fixed; bottom: 140px; right: 20px;
            background: white; color: black;
            padding: 12px 25px; border-radius: 25px;
            font-weight: bold; border: 4px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; pointer-events: auto; z-index: 20;
            transform-origin: center; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="stat-box">⚡ Енергія <div class="bar-container"><div id="energy-fill" class="bar-fill"></div></div></div>
        <div class="stat-box">🍔 Їжа <div class="bar-container"><div id="hunger-fill" class="bar-fill"></div></div></div>
    </div>
    <div id="money-box">50 $</div>

    <div id="interact-btn" onclick="doInteraction()">Дія</div>

    <script src="game.js?v=fix20"></script>

    <script>
        window.updateStats = (e, h, m) => {
            document.getElementById('energy-fill').style.width = e + '%';
            document.getElementById('hunger-fill').style.width = h + '%';
            document.getElementById('money-box').innerText = m + ' $';
        };
        window.showButton = (txt, type) => {
            const btn = document.getElementById('interact-btn');
            btn.innerText = txt; btn.style.display = 'block'; window.currentAction = type;
        };
        window.hideButton = () => {
            document.getElementById('interact-btn').style.display = 'none'; window.currentAction = null;
        };
        function doInteraction() {
            if (window.gameScene && window.currentAction) window.gameScene.triggerAction(window.currentAction);
        }
    </script>
</body>
</html>
