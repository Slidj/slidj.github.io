<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР (IFRAME) */
        #player-area { 
            display: none; 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 100; 
            width: 100%;
            padding-bottom: 5px;
            border-bottom: 2px solid #333;
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .control-bar { padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; }
        .btn-close { 
            background: #d32f2f; color: white; border: none; 
            padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        /* СПИСОК */
        .header { padding: 15px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between;}
        .status-dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; }
        
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #1e1e1e; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
            transition: transform 0.1s;
        }
        .card:active { transform: scale(0.98); }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #333; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px; }
        .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; line-height: 1.3; }
        .sub { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="iframe-container">
            <div id="player-placeholder"></div>
        </div>
        <div class="control-bar">
            <span>YouTube Player</span>
            <button class="btn-close" onclick="closePlayer()">ЗАКРИТИ</button>
        </div>
    </div>

    <div class="header">
        Media Hub <span class="status-dot"></span>
    </div>

    <div id="list" class="list">
        <div style="padding:20px; text-align:center; color:#666;">Завантаження списку...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Використовуємо стабільний Invidious API для списку (через проксі)
        const PROXY = 'https://api.allorigins.win/raw?url=';
        // Цей сервер зазвичай віддає списки без проблем
        const API_URL = 'https://inv.bp.projectsegfau.lt/api/v1/trending?region=UA';

        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');

        async function init() {
            try {
                // Запитуємо список
                const res = await fetch(PROXY + encodeURIComponent(API_URL));
                const data = await res.json();
                
                renderList(data);
            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div style="padding:20px; text-align:center; color:orange;">
                    Не вдалося отримати тренди.<br>
                    <button onclick="location.reload()" style="margin-top:10px; padding:10px; background:#333; color:white; border:none; border-radius:5px;">Спробувати ще раз</button>
                </div>`;
            }
        }

        function renderList(videos) {
            listEl.innerHTML = '';
            videos.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                
                // Invidious віддає videoId
                let id = v.videoId;
                // Картинка (беремо середню якість для швидкості)
                let thumb = v.videoThumbnails ? v.videoThumbnails[0].url : `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

                el.innerHTML = `
                    <div class="thumb-wrapper">
                        <img class="thumb" src="${thumb}" loading="lazy">
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="sub">${v.author} • ${formatTime(v.lengthSeconds)}</div>
                    </div>
                `;
                
                el.onclick = () => playVideo(id);
                listEl.appendChild(el);
            });
        }

        function playVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            
            // Вставляємо офіційний Iframe
            // autoplay=1 запускає відео
            // modestbranding=1 прибирає частину логотипів
            placeholder.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&modestbranding=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function closePlayer() {
            placeholder.innerHTML = ''; // Видаляємо iframe, щоб зупинити звук
            playerArea.style.display = 'none';
        }

        function formatTime(seconds) {
            if(!seconds) return "";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        init();
    </script>
</body>
</html>
