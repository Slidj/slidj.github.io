<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub (Mirrors)</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР */
        #player-area { 
            display: none; 
            position: sticky; top: 0; background: #000; z-index: 100; 
            width: 100%; border-bottom: 2px solid #333;
        }
        .iframe-container {
            position: relative; width: 100%; padding-bottom: 56.25%; background: #000;
        }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        
        .control-bar { padding: 10px; background: #1f1f1f; }
        .server-select {
            width: 100%; padding: 8px; margin-bottom: 8px;
            background: #333; color: white; border: 1px solid #444; border-radius: 6px;
        }
        .btn-close { 
            width: 100%; background: #d32f2f; color: white; border: none; 
            padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* СПИСОК */
        .header { padding: 15px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #1e1e1e; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
        }
        .card:active { opacity: 0.8; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 12px; }
        .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
        .sub { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="iframe-container">
            <div id="player-placeholder"></div>
        </div>
        <div class="control-bar">
            <select id="server-select" class="server-select" onchange="reloadVideo()">
                <option value="https://piped.video">Server 1 (Official)</option>
                <option value="https://piped.mha.fi">Server 2 (Europe)</option>
                <option value="https://api.piped.privacy.com.de">Server 3 (Germany)</option>
                <option value="https://yewtu.be">Server 4 (Invidious)</option>
                <option value="https://invidious.drgns.space">Server 5 (US)</option>
            </select>
            
            <button class="btn-close" onclick="closePlayer()">ЗАКРИТИ ПЛЕЄР</button>
        </div>
    </div>

    <div class="header">Media Hub (No Ads)</div>
    <div id="list" class="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Статичний список для тесту
        const VIDEOS = [
            { id: "LXb3EKWsInQ", title: "Nature 4K", author: "Jacob + Katie Schwarz", img: "https://i.ytimg.com/vi/LXb3EKWsInQ/hqdefault.jpg" },
            { id: "jfKfPfyJRdk", title: "Lofi Girl Radio", author: "Lofi Girl", img: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
            { id: "aqz-KE-bpKQ", title: "Big Buck Bunny", author: "Blender", img: "https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg" }
        ];

        let currentVideoId = '';
        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');
        const serverSelect = document.getElementById('server-select');

        function init() {
            listEl.innerHTML = '';
            VIDEOS.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="thumb-wrapper"><img class="thumb" src="${v.img}"></div>
                    <div class="info"><div class="title">${v.title}</div><div class="sub">${v.author}</div></div>
                `;
                el.onclick = () => playVideo(v.id);
                listEl.appendChild(el);
            });
        }

        function playVideo(id) {
            currentVideoId = id;
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            loadIframe();
        }

        function loadIframe() {
            const server = serverSelect.value;
            let src = '';

            // Різні сервери мають трохи різний формат посилань
            if (server.includes('yewtu.be') || server.includes('invidious')) {
                // Це Invidious
                src = `${server}/embed/${currentVideoId}?autoplay=1`;
            } else {
                // Це Piped
                src = `${server}/embed/${currentVideoId}?autoplay=1`;
            }

            placeholder.innerHTML = `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
        }

        // Перезавантажити відео при зміні сервера
        function reloadVideo() {
            if (currentVideoId) {
                console.log("Switching to:", serverSelect.value);
                loadIframe();
            }
        }

        function closePlayer() {
            placeholder.innerHTML = ''; 
            playerArea.style.display = 'none';
            currentVideoId = '';
        }

        init();
    </script>
</body>
</html>
