<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Precise</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1a1d26 0%, #0d0e12 100%);
            --text-primary: #ffffff;
            --text-secondary: #8d95a8;
            --candle-up: #26a69a;
            --candle-down: #ef5350;
            --bet-gold: #ffcf00; /* Яскравий жовтий для фіксації */
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        /* HEADER */
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 0 16px; padding-top: calc(90px + env(safe-area-inset-top)); 
            height: 60px; display: flex; justify-content: space-between; align-items: flex-start; 
            z-index: 20; pointer-events: none;
        }
        .user-profile, .market-controls { pointer-events: auto; }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.05); object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .balance { font-size: 13px; color: #ffce00; font-weight: 600; margin-top: 2px; }

        .market-controls { display: flex; flex-direction: column; align-items: flex-end; }
        .asset-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: rgba(30,34,45, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
        }
        #asset-select {
            background: transparent; color: white; border: none; font-weight: 700; font-size: 15px; outline: none; appearance: none;
        }
        .settings-icon { width: 20px; height: 20px; fill: var(--text-secondary); }

        .price-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .price { font-size: 20px; font-weight: 700; font-family: 'SF Mono', 'Roboto Mono', monospace; text-shadow: 0 0 15px rgba(255,255,255,0.15); transition: color 0.1s; }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%; background-color: var(--candle-up);
            box-shadow: 0 0 0 rgba(38, 166, 154, 0.4); transition: background-color 0.1s;
        }

        /* CHART CONTAINER */
        #chart-container { position: absolute; top: 0; left: 0; right: 0; bottom: 110px; z-index: 1; }

        /* RESET ZOOM BUTTON */
        #reset-zoom-btn {
            position: absolute; bottom: 130px; right: 16px;
            width: 44px; height: 44px; border-radius: 50%;
            background: #1c1e26; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 30; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #reset-zoom-btn.show { opacity: 1; pointer-events: auto; }

        /* CONTROLS */
        .controls-wrapper {
            position: absolute; bottom: 0; left: 0; right: 0; height: 110px;
            padding: 0 16px 20px 16px;
            background: linear-gradient(to top, #0b0c10 95%, transparent 100%);
            display: flex; gap: 16px; align-items: center; z-index: 20;
        }
        .btn {
            flex: 1; height: 64px; border: none; border-radius: 20px;
            font-size: 20px; font-weight: 800; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.1s; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.15);
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-up { background: linear-gradient(135deg, #26a69a 0%, #00897b 100%); color: #e0f2f1; }
        .btn-down { background: linear-gradient(135deg, #ef5350 0%, #c62828 100%); color: #ffebee; }

        /* MODALS */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: #1c1e26; padding: 24px; border-radius: 24px; width: 280px; text-align: center;
            opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        
        .settings-row { margin-bottom: 24px; text-align: left; }
        .settings-label { color: var(--text-secondary); font-size: 13px; margin-bottom: 12px; display: block; font-weight: 700; text-transform: uppercase; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #2a2e39; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #fff; margin-top: -8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'%3E%3Crect width='24' height='24' fill='%23333'/%3E%3C/svg%3E" class="user-avatar">
            <div class="user-info">
                <div id="user-name" class="user-name">Apex Trader</div>
                <div class="balance" id="balance">$1,000</div>
            </div>
        </div>
        
        <div class="market-controls">
            <div class="asset-wrapper" onclick="toggleSettings()">
                <select id="asset-select" onclick="event.stopPropagation()">
                    <option value="btcusdt">BTC/USDT</option>
                    <option value="ethusdt">ETH/USDT</option>
                    <option value="solusdt">SOL/USDT</option>
                    <option value="dogeusdt">DOGE/USDT</option>
                </select>
                <svg class="settings-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </div>
            <div class="price-container">
                <div class="pulse-dot" id="pulse-dot"></div>
                <div class="price" id="price">Loading...</div>
            </div>
        </div>
    </div>

    <div id="chart-container"></div>
    <div id="reset-zoom-btn" onclick="resetZoom()">🎯</div>

    <div id="result-popup" class="modal">
        <div id="result-title" style="font-weight: 800; font-size: 22px; margin-bottom: 5px;">RESULT</div>
        <div id="result-amount" style="font-size: 32px; font-weight: 900; color: white;">$0</div>
    </div>

    <div id="settings-popup" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; color:white;">Налаштування</h3>
            <span onclick="toggleSettings()" style="font-size:24px; cursor:pointer; color: #fff;">&times;</span>
        </div>
        <div class="settings-row">
            <label class="settings-label">Масштаб (Zoom)</label>
            <input type="range" id="zoom-slider" min="10" max="40" value="18" step="1">
        </div>
        <div class="settings-row">
            <label class="settings-label">Розмір шрифту</label>
            <input type="range" id="font-slider" min="10" max="16" value="13" step="1">
        </div>
    </div>

    <div class="controls-wrapper">
        <button class="btn btn-up" onclick="startTrade('UP')"><span>↑</span> CALL</button>
        <button class="btn btn-down" onclick="startTrade('DOWN')"><span>↓</span> PUT</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0b0c10'); 

        const CONFIG = { up: '#26a69a', down: '#ef5350' };

        // --- CHART INIT ---
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#8d95a8', fontSize: 13, fontFamily: "monospace" },
            grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255,255,255,0.05)', style: 1 } },
            
            // --- FIX FOR AUTO SCALE ---
            // Використовуємо режим 0 (Normal/Linear) замість Logarithmic.
            // Це краще для короткострокових коливань і швидше "повертається" в норму.
            priceScale: { mode: 0, autoScale: true, scaleMargins: { top: 0.35, bottom: 0.35 } }, 
            
            rightPriceScale: { borderColor: 'transparent' },
            // Збільшили barSpacing (18), щоб свічок було менше на екрані -> швидше зникають старі піки
            timeScale: { borderColor: 'transparent', timeVisible: true, secondsVisible: true, visible: true, barSpacing: 18 },
            crosshair: { mode: 1, vertLine: { style: 2, color: 'rgba(255,255,255,0.2)' }, horzLine: { style: 2, color: 'rgba(255,255,255,0.2)' } }
        });

        let series = chart.addCandlestickSeries({
            upColor: CONFIG.up, borderUpColor: CONFIG.up, wickUpColor: CONFIG.up,
            downColor: CONFIG.down, borderDownColor: CONFIG.down, wickDownColor: CONFIG.down,
            priceLineVisible: true, priceLineWidth: 1, priceLineStyle: 2,
            priceFormat: { minMove: 0.000001, precision: 6 }
        });

        window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);

        // Reset Zoom Logic
        chart.timeScale().subscribeVisibleTimeRangeChange(() => { document.getElementById('reset-zoom-btn').classList.add('show'); });
        function resetZoom() {
            chart.timeScale().scrollToRealTime(); 
            // Примусово скидаємо масштаб
            chart.priceScale('right').applyOptions({ autoScale: true });
            document.getElementById('reset-zoom-btn').classList.remove('show'); 
        }

        function toggleSettings() { document.getElementById('settings-popup').classList.toggle('show'); }
        document.getElementById('zoom-slider').addEventListener('input', (e) => chart.timeScale().applyOptions({ barSpacing: parseFloat(e.target.value) }));
        document.getElementById('font-slider').addEventListener('input', (e) => chart.applyOptions({ layout: { fontSize: parseInt(e.target.value) } }));

        // --- ENGINE: SMOOTH RAW CANDLES (PRECISE) ---
        let ws = null;
        let realCandle = null;      
        let displayCandle = null;   
        let lastPrice = 0;

        const priceElement = document.getElementById('price');
        const pulseDot = document.getElementById('pulse-dot');
        const assetSelect = document.getElementById('asset-select');

        function animate() {
            if (realCandle && displayCandle) {
                if (realCandle.time > displayCandle.time) {
                    displayCandle = { ...realCandle };
                } else {
                    const diff = realCandle.close - displayCandle.close;
                    if (Math.abs(diff) > 0.000001) {
                        displayCandle.close += diff * 0.15;
                        displayCandle.high = Math.max(displayCandle.high, displayCandle.close);
                        displayCandle.low = Math.min(displayCandle.low, displayCandle.close);
                        displayCandle.high = Math.max(displayCandle.high, realCandle.high);
                        displayCandle.low = Math.min(displayCandle.low, realCandle.low);
                    } else {
                        displayCandle.close = realCandle.close;
                    }
                }
                series.update(displayCandle);
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        function connectWebSocket(symbol) {
            if (ws) ws.close();
            series.setData([]);
            priceElement.innerText = 'Loading...';
            realCandle = null; displayCandle = null;

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@aggTrade`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                const time = Math.floor(data.T / 1000);

                if (!realCandle || time > realCandle.time) {
                    realCandle = { time: time, open: realCandle ? realCandle.close : price, high: price, low: price, close: price };
                    if (!displayCandle) displayCandle = { ...realCandle };
                } else {
                    realCandle.high = Math.max(realCandle.high, price);
                    realCandle.low = Math.min(realCandle.low, price);
                    realCandle.close = price;
                }

                const digits = price < 1 ? 6 : 2; 
                priceElement.innerText = price.toFixed(digits);
                const color = !lastPrice || price >= lastPrice ? CONFIG.up : CONFIG.down;
                priceElement.style.color = color;
                pulseDot.style.backgroundColor = color;
                lastPrice = price;
            };
        }

        assetSelect.addEventListener('change', (e) => connectWebSocket(e.target.value));
        connectWebSocket('btcusdt');

        // --- TRADING LOGIC FIXED ---
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name; 
            if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;
        }

        let balance = 1000;
        let isTrading = false;
        let betLine = null;

        function startTrade(direction) {
            if (isTrading) return;
            isTrading = true;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            
            // 🔥 ВИПРАВЛЕННЯ ПОЗИЦІЇ:
            // Ми беремо displayCandle.close - це саме те число, де ЗАРАЗ намальована свічка на екрані.
            // Це гарантує, що лінія з'явиться точно на рівні очей.
            const entryPrice = displayCandle ? displayCandle.close : lastPrice; 
            
            const betAmount = 50;
            const lineColor = '#ffcf00'; // Gold Color

            betLine = series.createPriceLine({
                price: entryPrice, 
                color: lineColor, 
                lineWidth: 2, 
                lineStyle: 0, 
                title: 'ENTRY', 
                axisLabelVisible: true, // ПОКАЗУЄМО ПРИВИДА
                axisLabelColor: lineColor,
                axisLabelTextColor: '#000000'
            });

            setTimeout(() => { finishTrade(direction, entryPrice, betAmount); }, 3000);
        }

        function finishTrade(direction, entryPrice, betAmount) {
            let win = false;
            // Порівнюємо теж з відображуваною ціною, щоб було чесно візуально
            const finalPrice = displayCandle ? displayCandle.close : lastPrice;
            
            if (direction === 'UP' && finalPrice > entryPrice) win = true;
            else if (direction === 'DOWN' && finalPrice < entryPrice) win = true;

            if (win) balance += betAmount * 0.8; else balance -= betAmount;
            document.getElementById('balance').innerText = `$${balance.toFixed(0)}`;
            
            if (betLine) { series.removePriceLine(betLine); betLine = null; }

            const popup = document.getElementById('result-popup');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            title.innerText = win ? 'PROFIT' : 'LOSS';
            title.style.color = win ? CONFIG.up : CONFIG.down;
            amount.innerText = win ? `+$${(betAmount * 0.8).toFixed(0)}` : `-$${betAmount}`;
            popup.style.borderColor = win ? CONFIG.up : CONFIG.down;
            popup.classList.add('show');
            
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
            setTimeout(() => { popup.classList.remove('show'); isTrading = false; }, 2000);
        }
    </script>
</body>
</html>
