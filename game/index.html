<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР */
        #player-area { 
            display: none; 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 100; 
            border-bottom: 2px solid #333;
        }
        video { width: 100%; display: block; max-height: 40vh; }
        .control-bar { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; }
        .btn-close { 
            background: #d32f2f; color: white; border: none; 
            padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }

        /* СПИСОК */
        .header { padding: 15px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; }
        .status-msg { font-size: 12px; color: #aaa; margin-left: 10px; font-weight: normal; }
        
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #1e1e1e; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
        }
        .card:active { opacity: 0.8; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; /* 16:9 aspect ratio */ background: #333; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px; }
        .title { font-size: 15px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; }
        .sub { color: #aaa; font-size: 13px; }

        /* Error Banner */
        .offline-badge {
            background-color: #ff9800; color: black; padding: 10px; text-align: center;
            font-size: 13px; font-weight: bold; display: none;
        }
    </style>
</head>
<body>

    <div id="player-area">
        <video id="main-video" controls playsinline autoplay></video>
        <div class="control-bar">
            <span>Відтворення</span>
            <button class="btn-close" onclick="closePlayer()">Закрити</button>
        </div>
    </div>

    <div id="offline-msg" class="offline-badge">
        Сервер недоступний. Показано демо-режим.
    </div>

    <div class="header">
        Головна <span id="status" class="status-msg">...</span>
    </div>

    <div id="list" class="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- КОНФІГУРАЦІЯ ---
        // Використовуємо проксі, щоб обійти CORS
        const PROXY = 'https://api.allorigins.win/raw?url=';
        
        // Спробуємо інший сервер (більш стабільний для Європи)
        const API_SERVER = 'https://pipedapi.drgns.space'; 
        
        // ЗАПАСНІ ВІДЕО (Якщо сервер впав - покажемо це)
        const FALLBACK_DATA = [
            {
                title: "🔴 [ТЕСТ] Природа 4K (Сервер не відповів)",
                uploaderName: "Demo Channel",
                thumbnail: "https://i.ytimg.com/vi/LXb3EKWsInQ/hqdefault.jpg",
                url: "/watch?v=LXb3EKWsInQ",
                duration: 120
            },
            {
                title: "🎵 Lofi Hip Hop Radio",
                uploaderName: "Lofi Girl",
                thumbnail: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg",
                url: "/watch?v=jfKfPfyJRdk",
                duration: 3600
            },
            {
                title: "🔥 Cyberpunk Music",
                uploaderName: "Music Lab",
                thumbnail: "https://i.ytimg.com/vi/P1k500i7m40/hqdefault.jpg",
                url: "/watch?v=P1k500i7m40",
                duration: 300
            }
        ];

        // Елементи
        const listEl = document.getElementById('list');
        const statusEl = document.getElementById('status');
        const offlineMsg = document.getElementById('offline-msg');
        const playerArea = document.getElementById('player-area');
        const videoEl = document.getElementById('main-video');

        // 1. ГОЛОВНА ФУНКЦІЯ
        async function init() {
            statusEl.innerText = "Завантаження...";
            
            try {
                // Формуємо посилання через проксі
                const target = `${API_SERVER}/trending?region=UA`;
                const finalUrl = PROXY + encodeURIComponent(target);

                // Ставимо тайм-аут 5 секунд (якщо сервер довго думає - кидаємо помилку)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const response = await fetch(finalUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error("Помилка API");
                
                const data = await response.json();
                statusEl.innerText = "";
                renderList(data);

            } catch (error) {
                console.warn("API Error:", error);
                // ЯКЩО ПОМИЛКА -> ВКЛЮЧАЄМО ЗАПАСНИЙ ПЛАН
                useFallbackMode();
            }
        }

        // 2. РЕЖИМ "ОФЛАЙН" (ДЕМО)
        function useFallbackMode() {
            statusEl.innerText = "(Демо)";
            offlineMsg.style.display = 'block'; // Показуємо помаранчеву плашку
            renderList(FALLBACK_DATA);
        }

        // 3. МАЛЮВАННЯ КАРТОК
        function renderList(videos) {
            listEl.innerHTML = '';
            videos.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                
                // Витягуємо ID
                let id = v.url.split('v=')[1];
                if(!id) return; // Пропускаємо биті

                el.innerHTML = `
                    <div class="thumb-wrapper">
                        <img class="thumb" src="${v.thumbnail}" loading="lazy">
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="sub">${v.uploaderName}</div>
                    </div>
                `;
                
                el.onclick = () => playVideo(id);
                listEl.appendChild(el);
            });
        }

        // 4. ВІДТВОРЕННЯ
        async function playVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            
            // Скидаємо старе
            videoEl.src = "";
            
            // Якщо це тестове відео, можемо хардкодити посилання (для стабільності тесту)
            // Але спробуємо отримати чесний потік спочатку
            try {
                const target = `${API_SERVER}/streams/${id}`;
                const finalUrl = PROXY + encodeURIComponent(target);
                
                const res = await fetch(finalUrl);
                const data = await res.json();
                
                // Шукаємо mp4
                const stream = data.videoStreams.find(s => s.format === 'MPEG-4' && !s.videoOnly);
                
                if (stream) {
                    videoEl.src = stream.url;
                    videoEl.play();
                } else {
                    alert("Не вдалося знайти потік відео. Спробуйте інше.");
                }
            } catch (e) {
                alert("Сервер відео перевантажений. Спробуйте пізніше.");
                closePlayer();
            }
        }

        function closePlayer() {
            videoEl.pause();
            videoEl.src = "";
            playerArea.style.display = 'none';
        }

        // Старт
        init();

    </script>
</body>
</html>
