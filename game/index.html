<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            /* Темний преміум фон */
            --bg-color: #12141a;
            --card-bg: #1e222d;
            --text-primary: #ffffff;
            --text-secondary: #858d9d;
            --accent-green: #00ffbb; /* Neon Green */
            --accent-red: #ff2d55;   /* Neon Red */
            --bet-color: #fbbf24;    /* Gold */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        /* HEADER */
        .header {
            position: absolute; top: 0; left: 0; right: 0;
            padding: 0 16px; padding-top: calc(90px + env(safe-area-inset-top)); 
            height: 60px; display: flex; justify-content: space-between; align-items: flex-start; 
            z-index: 20; pointer-events: none;
        }
        .user-profile, .market-controls { pointer-events: auto; }

        /* Профіль */
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 42px; height: 42px; border-radius: 10px;
            background: rgba(255,255,255,0.05); object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 15px; }
        .balance { font-size: 13px; color: var(--bet-color); font-weight: 700; }

        /* Правий блок */
        .market-controls { display: flex; flex-direction: column; align-items: flex-end; }
        .asset-wrapper {
            display: flex; align-items: center; gap: 8px;
            background: var(--card-bg); padding: 6px 12px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #asset-select {
            background: transparent; color: white; border: none; font-weight: 700; font-size: 14px; outline: none; appearance: none;
        }
        
        /* ЦІНА */
        .price-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .price { font-size: 22px; font-weight: 700; font-family: 'SF Mono', monospace; transition: color 0.2s; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green);
            box-shadow: 0 0 0 rgba(0, 255, 187, 0.4); transition: background-color 0.2s;
        }

        /* CHART */
        #chart-container { position: absolute; top: 0; left: 0; right: 0; bottom: 100px; z-index: 1; }

        /* ZOOM BUTTON */
        #reset-zoom-btn {
            position: absolute; bottom: 120px; right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--card-bg); color: white; display: flex; align-items: center; justify-content: center;
            font-size: 18px; z-index: 30; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #reset-zoom-btn.show { opacity: 1; pointer-events: auto; }

        /* CONTROLS */
        .controls-wrapper {
            position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
            padding: 0 16px 20px 16px;
            background: linear-gradient(to top, var(--bg-color) 90%, transparent 100%);
            display: flex; gap: 12px; align-items: center; z-index: 20;
        }
        .btn {
            flex: 1; height: 56px; border: none; border-radius: 12px;
            font-size: 18px; font-weight: 800; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.1s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.96); }
        .btn-up { background: var(--accent-green); color: #00332a; }
        .btn-down { background: var(--accent-red); color: #330009; }

        /* MODALS */
        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
            background: var(--card-bg); padding: 24px; border-radius: 16px; width: 260px; text-align: center;
            opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 100;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05);
        }
        .modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }

        .settings-row { margin-bottom: 20px; text-align: left; }
        .settings-label { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; display: block; font-weight: 700; text-transform: uppercase; }
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #2c313c; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #fff; margin-top: -7px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'%3E%3Crect width='24' height='24' fill='%23333'/%3E%3C/svg%3E" class="user-avatar">
            <div class="user-info">
                <div id="user-name" class="user-name">Apex Trader</div>
                <div class="balance" id="balance">$1,000</div>
            </div>
        </div>
        
        <div class="market-controls">
            <div class="asset-wrapper" onclick="toggleSettings()">
                <select id="asset-select" onclick="event.stopPropagation()">
                    <option value="btcusdt">BTC/USDT</option>
                    <option value="ethusdt">ETH/USDT</option>
                    <option value="solusdt">SOL/USDT</option>
                    <option value="dogeusdt">DOGE/USDT</option>
                </select>
                <span style="font-size:10px; margin-left:4px;">▼</span>
            </div>
            <div class="price-container">
                <div class="pulse-dot" id="pulse-dot"></div>
                <div class="price" id="price">...</div>
            </div>
        </div>
    </div>

    <div id="chart-container"></div>
    <div id="reset-zoom-btn" onclick="resetZoom()">⟲</div>

    <div id="result-popup" class="modal">
        <div id="result-title" style="font-weight: 800; font-size: 22px; margin-bottom: 5px;">RESULT</div>
        <div id="result-amount" style="font-size: 32px; font-weight: 900; color: white;">$0</div>
    </div>

    <div id="settings-popup" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; color:white;">Settings</h3>
            <span onclick="toggleSettings()" style="font-size:24px; cursor:pointer; color: #fff;">&times;</span>
        </div>
        <div class="settings-row">
            <label class="settings-label">Zoom</label>
            <input type="range" id="zoom-slider" min="10" max="50" value="16" step="1">
        </div>
    </div>

    <div class="controls-wrapper">
        <button class="btn btn-up" onclick="startTrade('UP')"><span>↑</span> CALL</button>
        <button class="btn btn-down" onclick="startTrade('DOWN')"><span>↓</span> PUT</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#12141a'); 

        const CONFIG = { up: '#00ffbb', down: '#ff2d55', bet: '#fbbf24' };

        // --- CHART SETUP ---
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#858d9d', fontSize: 12, fontFamily: "system-ui" },
            grid: { 
                vertLines: { visible: false }, 
                horzLines: { color: 'rgba(255,255,255,0.03)', style: 1 } 
            },
            // Margin 30% зверху і знизу - це дає вигляд "потоку" по центру
            priceScale: { autoScale: true, scaleMargins: { top: 0.3, bottom: 0.3 } },
            rightPriceScale: { borderColor: 'transparent' },
            timeScale: { 
                borderColor: 'transparent', timeVisible: true, secondsVisible: true, 
                barSpacing: 14, // ЖИРНІ СВІЧКИ
                minBarSpacing: 5
            },
            crosshair: { mode: 1, vertLine: { visible: false }, horzLine: { style: 2, color: '#ffffff', labelBackgroundColor: '#ffffff' } }
        });

        // Стиль свічок "Solid & Glow"
        let series = chart.addCandlestickSeries({
            upColor: CONFIG.up, 
            downColor: CONFIG.down,
            borderVisible: false, // Прибираємо рамки для чистого вигляду
            wickUpColor: CONFIG.up,
            wickDownColor: CONFIG.down,
            priceFormat: { minMove: 0.01, precision: 2 }
        });

        window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);

        chart.timeScale().subscribeVisibleTimeRangeChange(() => { document.getElementById('reset-zoom-btn').classList.add('show'); });
        function resetZoom() {
            chart.timeScale().scrollToRealTime(); 
            chart.priceScale('right').applyOptions({ autoScale: true });
            document.getElementById('reset-zoom-btn').classList.remove('show'); 
        }

        function toggleSettings() { document.getElementById('settings-popup').classList.toggle('show'); }
        document.getElementById('zoom-slider').addEventListener('input', (e) => chart.timeScale().applyOptions({ barSpacing: parseFloat(e.target.value) }));

        // --- ENGINE: HEIKIN ASHI + ANIMATION ---
        let ws = null;
        let realHA = null;      
        let displayHA = null;   
        let lastPrice = 0;
        let lastRawHA = null;   

        const priceElement = document.getElementById('price');
        const pulseDot = document.getElementById('pulse-dot');
        const assetSelect = document.getElementById('asset-select');

        function animate() {
            if (realHA && displayHA) {
                if (realHA.time > displayHA.time) {
                    // Нова свічка
                    displayHA = { ...realHA };
                } else {
                    // Інтерполяція
                    const diff = realHA.close - displayHA.close;
                    if (Math.abs(diff) > 0.0001) {
                        displayHA.close += diff * 0.2; // Швидкість анімації
                        
                        // Heikin Ashi візуал
                        displayHA.high = Math.max(displayHA.open, displayHA.close, realHA.high);
                        displayHA.low = Math.min(displayHA.open, displayHA.close, realHA.low);
                    }
                }
                series.update(displayHA);
            }
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        function calculateHeikinAshi(time, open, high, low, close) {
            const haClose = (open + high + low + close) / 4;
            let haOpen = open;
            if (lastRawHA) {
                haOpen = (lastRawHA.open + lastRawHA.close) / 2;
            }
            const haHigh = Math.max(high, haOpen, haClose);
            const haLow = Math.min(low, haOpen, haClose);
            return { time, open: haOpen, high: haHigh, low: haLow, close: haClose };
        }

        function connectWebSocket(symbol) {
            if (ws) ws.close();
            series.setData([]);
            priceElement.innerText = 'Loading...';
            realHA = null; displayHA = null; lastRawHA = null;
            let rawCandle = null;

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@aggTrade`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                const time = Math.floor(data.T / 1000);

                if (!rawCandle || time > rawCandle.time) {
                    if (realHA) lastRawHA = { ...realHA };
                    rawCandle = { time: time, open: rawCandle ? rawCandle.close : price, high: price, low: price, close: price };
                } else {
                    rawCandle.high = Math.max(rawCandle.high, price);
                    rawCandle.low = Math.min(rawCandle.low, price);
                    rawCandle.close = price;
                }

                realHA = calculateHeikinAshi(rawCandle.time, rawCandle.open, rawCandle.high, rawCandle.low, rawCandle.close);
                
                if (!displayHA) {
                    displayHA = { ...realHA };
                }

                const digits = price < 1 ? 5 : 2; 
                series.applyOptions({ priceFormat: { precision: digits, minMove: 1/Math.pow(10, digits) } });

                priceElement.innerText = price.toFixed(digits);
                const color = !lastPrice || price >= lastPrice ? CONFIG.up : CONFIG.down;
                priceElement.style.color = color;
                pulseDot.style.backgroundColor = color;
                lastPrice = price;
            };
        }

        assetSelect.addEventListener('change', (e) => connectWebSocket(e.target.value));
        connectWebSocket('btcusdt');

        // --- TRADING LOGIC ---
        let balance = 1000;
        let isTrading = false;
        let betLine = null;

        function startTrade(direction) {
            if (isTrading) return;
            isTrading = true;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            
            // 🔥 ФІКСАЦІЯ ПРИВИДА ТАМ, ДЕ ОКО БАЧИТЬ (Visual Price)
            const entryPrice = displayHA ? displayHA.close : lastPrice; 
            
            const betAmount = 50;
            
            // Створюємо "Заморожену лінію"
            betLine = series.createPriceLine({
                price: entryPrice, 
                color: CONFIG.bet, 
                lineWidth: 2, 
                lineStyle: 0, // Суцільна
                title: 'BET', 
                axisLabelVisible: true, // Це та сама мітка на осі
                axisLabelColor: CONFIG.bet,
                axisLabelTextColor: '#000000'
            });

            setTimeout(() => { finishTrade(direction, entryPrice, betAmount); }, 3000);
        }

        function finishTrade(direction, entryPrice, betAmount) {
            let win = false;
            // Перевіряємо по тій же візуальній ціні, щоб було чесно
            const finalPrice = displayHA ? displayHA.close : lastPrice;
            
            if (direction === 'UP' && finalPrice > entryPrice) win = true;
            else if (direction === 'DOWN' && finalPrice < entryPrice) win = true;

            if (win) balance += betAmount * 0.8; else balance -= betAmount;
            document.getElementById('balance').innerText = `$${balance.toFixed(0)}`;
            
            if (betLine) { series.removePriceLine(betLine); betLine = null; }

            const popup = document.getElementById('result-popup');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');
            title.innerText = win ? 'PROFIT' : 'LOSS';
            title.style.color = win ? CONFIG.up : CONFIG.down;
            amount.innerText = win ? `+$${(betAmount * 0.8).toFixed(0)}` : `-$${betAmount}`;
            popup.style.borderColor = win ? CONFIG.up : CONFIG.down;
            popup.classList.add('show');
            
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
            setTimeout(() => { popup.classList.remove('show'); isTrading = false; }, 2000);
        }
    </script>
</body>
</html>
