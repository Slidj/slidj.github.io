<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival RPG</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #1a1a1a; /* Темний фон, щоб зливався з грою */
            overflow: hidden; 
            touch-action: none; /* Блокуємо зум пальцями */
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Стиль кнопки Дії (Рубати/Атакувати) */
        #action-btn {
            position: fixed;
            bottom: 40px;
            right: 30px;
            width: 90px;
            height: 90px;
            background: rgba(180, 40, 40, 0.8); /* Червонувата кнопка */
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            user-select: none;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        #action-btn:active { 
            background: rgba(220, 20, 20, 1); 
            transform: scale(0.90); 
            border-color: #fff;
        }

        /* Іконка всередині кнопки */
        .btn-icon {
            pointer-events: none; /* Щоб клік проходив крізь іконку */
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="action-btn">
        <span class="btn-icon">⚔️</span>
    </div>

    <script src="game.js?v=6"></script>
</body>
</html>
