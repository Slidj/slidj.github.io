<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim: Action Screen</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #7b61ff; --text: #fff; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding-bottom: 80px; user-select: none;
        }

        /* --- СЦЕНА (КІМНАТА) --- */
        .scene-container {
            position: relative; width: 100%; height: 300px;
            background-color: #333; border-bottom: 10px solid #555;
            overflow: hidden;
        }

        /* ГЕРОЙ (Більше не рухається, просто стоїть) */
        #visual-hero {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 80px; z-index: 10;
        }

        /* МЕБЛІ */
        .room-item { position: absolute; font-size: 50px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 40px; }
        #item-bed { left: 30px; bottom: 40px; }

        /* --- ШИРМА ДІЇ (Action Overlay) --- */
        #action-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Темний напівпрозорий фон */
            backdrop-filter: blur(5px); /* Ефект розмиття фону */
            display: none; /* Приховано за замовчуванням */
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 200; /* Поверх усього */
            color: white;
        }
        /* Анімація появи ширми */
        #action-overlay.active { display: flex; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .overlay-icon { font-size: 100px; margin-bottom: 20px; }
        .overlay-text { font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }

        /* --- ІНТЕРФЕЙС --- */
        .ui { padding: 20px; }
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .money { color: #00b894; font-weight: bold; font-size: 24px; }
        
        .btn {
            background: var(--card); color: white; border: 1px solid #333;
            padding: 15px; width: 100%; margin-bottom: 10px; border-radius: 12px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; text-align: left;
        }
        .btn:active { transform: scale(0.98); background: #333; }
        .btn-icon { font-size: 24px; color: var(--accent); background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }

        /* Tabs & Nav */
        .tab { display: none; } .tab.active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; padding: 15px 0; border-top: 1px solid #333; }
        .nav-btn { flex: 1; background: none; border: none; font-size: 24px; color: #555; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body>

    <div class="scene-container">
        <div id="action-overlay">
            <div id="overlay-icon" class="overlay-icon">💻</div>
            <div id="overlay-text" class="overlay-text">Працюю...</div>
        </div>

        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="header">
            <div>Баланс: <span id="money" class="money">0</span> $</div>
            <div>Енергія: <span id="energy">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <h3>Дії</h3>
            <button class="btn" onclick="doAction('work')">
                <div class="btn-icon"><i class="ri-macbook-line"></i></div>
                <div><b>Фріланс</b><br><small>3 сек | +15$ | -10 Енергії</small></div>
            </button>
            <button class="btn" onclick="doAction('sleep')">
                <div class="btn-icon"><i class="ri-hotel-bed-line"></i></div>
                <div><b>Відпочити</b><br><small>3 сек | +20 Енергії</small></div>
            </button>
        </div>

        <div id="tab-shop" class="tab">
            <h3>Магазин</h3>
            <button class="btn" onclick="buy('pc')">
                <div class="btn-icon"><i class="ri-computer-line"></i></div>
                <div><b>Купити ПК</b> (100$)<br><small>Потрібен для роботи</small></div>
            </button>
            <button class="btn" onclick="buy('bed')">
                <div class="btn-icon"><i class="ri-home-heart-line"></i></div>
                <div><b>Купити Ліжко</b> (100$)<br><small>Потрібне для сну</small></div>
            </button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="ri-home-5-line"></i></button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><i class="ri-shopping-cart-2-line"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let game = { money: 300, energy: 100, inventory: [], isBusy: false };
        if(localStorage.getItem('simScreen')) game = JSON.parse(localStorage.getItem('simScreen'));

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;
            document.getElementById('item-pc').style.display = game.inventory.includes('pc') ? 'block' : 'none';
            document.getElementById('item-bed').style.display = game.inventory.includes('bed') ? 'block' : 'none';
        }

        // --- ГОЛОВНА ЗМІНА: ЛОГІКА ДІЇ ---
        function doAction(type) {
            if(game.isBusy) return;
            
            const overlay = document.getElementById('action-overlay');
            const icon = document.getElementById('overlay-icon');
            const text = document.getElementById('overlay-text');
            let duration = 3000;

            if (type === 'work') {
                if (!game.inventory.includes('pc')) return alert("Потрібен ПК!");
                if (game.energy < 10) return alert("Мало енергії!");
                
                game.isBusy = true;
                game.energy -= 10;
                
                // Налаштовуємо ширму
                icon.innerText = "👨‍💻";
                text.innerText = "ПИШУ КОД...";
                overlay.classList.add('active'); // Показуємо ширму

                setTimeout(() => {
                    game.money += 15;
                    finishAction();
                }, duration);
            }

            if (type === 'sleep') {
                if (!game.inventory.includes('bed')) return alert("Потрібне ліжко!");
                
                game.isBusy = true;
                // Налаштовуємо ширму
                icon.innerText = "😴";
                text.innerText = "СОЛОДКИЙ СОН...";
                overlay.classList.add('active');

                setTimeout(() => {
                    game.energy = Math.min(100, game.energy + 20);
                    finishAction();
                }, duration);
            }
            render();
        }

        function finishAction() {
            game.isBusy = false;
            // Приховуємо ширму
            document.getElementById('action-overlay').classList.remove('active');
            save();
            render();
        }

        function buy(item) {
            if(game.inventory.includes(item)) return alert("Вже є!");
            if(game.money < 100) return alert("Нема грошей!");
            game.money -= 100;
            game.inventory.push(item);
            save(); render();
        }

        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function save() { localStorage.setItem('simScreen', JSON.stringify(game)); }
        render();
    </script>
</body>
</html>
