<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tube App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #1c1c1e; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* Плеєр */
        #player-box { 
            display: none; 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 99; 
            border-bottom: 1px solid #333;
        }
        video { width: 100%; display: block; max-height: 40vh; }
        .close-btn { 
            width: 100%; padding: 12px; background: #ff3b30; 
            color: white; border: none; font-weight: bold; cursor: pointer;
        }

        /* Список */
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #2c2c2e; border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .thumb { width: 100%; height: 180px; object-fit: cover; background: #333; }
        .info { padding: 12px; }
        .title { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
        .sub { color: #aaa; font-size: 13px; }
        
        /* Статус */
        #status { padding: 15px; text-align: center; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

    <div id="player-box">
        <video id="video-el" controls playsinline autoplay></video>
        <button class="close-btn" onclick="closeVideo()">ЗАКРИТИ ВІДЕО</button>
    </div>

    <div id="status">З'єднання з сервером...</div>

    <div class="list" id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- НАЛАШТУВАННЯ ЩОБ ОБІЙТИ БЛОКУВАННЯ ---
        
        // 1. Проксі-сервер (дозволяє запити з GitHub Pages)
        const PROXY = 'https://api.allorigins.win/raw?url=';
        
        // 2. Сервер даних (Piped)
        // Ми кодуємо URL, щоб передати його через проксі
        const BASE_API = 'https://pipedapi.kavin.rocks'; 
        // Інші варіанти, якщо kavin не працює:
        // 'https://api.piped.privacy.com.de'
        // 'https://pipedapi.drgns.space'

        const listEl = document.getElementById('list');
        const statusEl = document.getElementById('status');
        const playerBox = document.getElementById('player-box');
        const videoEl = document.getElementById('video-el');

        // ЗАПУСК
        async function start() {
            statusEl.innerText = "Завантаження списку відео...";
            
            try {
                // Складаємо хитрий URL: Проксі + Реальний API
                const targetUrl = `${BASE_API}/trending?region=UA`;
                const finalUrl = PROXY + encodeURIComponent(targetUrl);

                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error("Помилка відповіді сервера");
                
                const data = await res.json();
                
                statusEl.style.display = 'none'; // Ховаємо напис, якщо все ок
                render(data);
                
            } catch (e) {
                console.error(e);
                statusEl.innerHTML = `<span style="color:#ff453a">Не вдалося завантажити тренди.<br>Спробуйте пізніше або змініть сервер в коді.</span>`;
            }
        }

        // МАЛЮВАННЯ СПИСКУ
        function render(videos) {
            listEl.innerHTML = '';
            videos.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                
                // Витягуємо ID відео
                let id = v.url.split('v=')[1]; 

                el.innerHTML = `
                    <img class="thumb" src="${v.thumbnail}" loading="lazy">
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="sub">${v.uploaderName} • ${formatTime(v.duration)}</div>
                    </div>
                `;
                el.onclick = () => play(id);
                listEl.appendChild(el);
            });
        }

        // ВІДТВОРЕННЯ
        async function play(id) {
            playerBox.style.display = 'block';
            window.scrollTo(0,0); // Вгору
            
            // Якщо плеєр вже має це відео - просто граємо
            if (videoEl.getAttribute('data-id') === id) {
                videoEl.play();
                return;
            }

            // Якщо нове - шукаємо потік
            videoEl.src = "";
            statusEl.style.display = 'block';
            statusEl.innerText = "Отримання чистого потоку (без реклами)...";

            try {
                const targetUrl = `${BASE_API}/streams/${id}`;
                const finalUrl = PROXY + encodeURIComponent(targetUrl);

                const res = await fetch(finalUrl);
                const data = await res.json();
                
                // Шукаємо потік MP4
                const stream = data.videoStreams.find(s => s.format === 'MPEG-4' && !s.videoOnly);
                
                if (stream) {
                    videoEl.src = stream.url;
                    videoEl.setAttribute('data-id', id); // Запам'ятовуємо ID
                    videoEl.play();
                    statusEl.style.display = 'none';
                } else {
                    alert("Не знайдено сумісного потоку");
                    closeVideo();
                }
            } catch (e) {
                alert("Помилка завантаження відеофайлу");
                closeVideo();
            }
        }

        function closeVideo() {
            videoEl.pause();
            playerBox.style.display = 'none';
            statusEl.style.display = 'none';
        }

        // Допоміжна функція часу (секунди -> 05:30)
        function formatTime(seconds) {
            if (!seconds) return "";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        start();
    </script>
</body>
</html>
