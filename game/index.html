<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim: Spoilage</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #7b61ff; --text: #fff; --red: #ff4757; --green: #2ecc71; --yellow: #f1c40f; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding-bottom: 90px; user-select: none; }

        /* СЦЕНА */
        .scene-container { position: relative; width: 100%; height: 260px; background-color: #333; border-bottom: 8px solid #555; overflow: hidden; }
        #visual-hero { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 80px; z-index: 10; }
        .room-item { position: absolute; font-size: 50px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 40px; }
        #item-bed { left: 30px; bottom: 40px; }

        /* UI */
        .ui { padding: 15px; }
        .header { display: flex; justify-content: space-between; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .money { color: var(--green); font-weight: bold; font-size: 20px; }

        .btn { background: var(--card); color: white; border: 1px solid #333; padding: 15px; width: 100%; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; text-align: left; }
        .btn:active { transform: scale(0.98); background: #333; }
        .btn-icon { font-size: 24px; color: var(--accent); background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }

        /* КАРТКИ ІНВЕНТАРЮ */
        .inv-card { background: var(--card); border: 1px solid #333; padding: 12px; border-radius: 12px; margin-bottom: 10px; position: relative; }
        .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .inv-name { font-weight: bold; font-size: 14px; }
        
        /* Смужки */
        .bar-bg { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; transition: width 0.3s; }
        
        /* Стиль для їжі */
        .food-spoiled { border: 1px solid var(--red); opacity: 0.7; }
        .food-fresh { border: 1px solid var(--green); }

        .action-btn-small { padding: 8px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }

        /* TABS */
        .tab { display: none; } .tab.active { display: block; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; padding: 15px 0; border-top: 1px solid #333; z-index: 300; }
        .nav-btn { flex: 1; background: none; border: none; font-size: 24px; color: #555; }
        .nav-btn.active { color: var(--accent); }
        
        /* Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 999; color: white; flex-direction: column; }
        .overlay-emoji { font-size: 80px; }
    </style>
</head>
<body>

    <div id="overlay"><div class="overlay-emoji" id="overlay-emoji">🍔</div><h2 id="overlay-text">...</h2></div>

    <div class="scene-container">
        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="header">
            <div>💵 <span id="money">0</span></div>
            <div>⚡ <span id="energy">100</span>% ❤️ <span id="health">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <h3>Дії</h3>
            <button class="btn" onclick="work()">
                <div class="btn-icon"><i class="ri-macbook-line"></i></div>
                <div><b>Фріланс</b><br><small>+15$ | -10 Енергії | Знос ПК</small></div>
            </button>
            <button class="btn" onclick="sleep()">
                <div class="btn-icon"><i class="ri-hotel-bed-line"></i></div>
                <div><b>Сон</b><br><small>+20 Енергії | Знос ліжка</small></div>
            </button>
        </div>

        <div id="tab-inv" class="tab">
            <h3>Мій Інвентар</h3>
            <div id="inventory-list"></div>
        </div>

        <div id="tab-shop" class="tab">
            <h3>Техніка</h3>
            <button class="btn" onclick="buyItem('pc', 150)">
                <div class="btn-icon"><i class="ri-computer-line"></i></div>
                <div><b>ПК</b> (150$)<br><small>Для роботи</small></div>
            </button>
            <button class="btn" onclick="buyItem('bed', 100)">
                <div class="btn-icon"><i class="ri-home-heart-line"></i></div>
                <div><b>Ліжко</b> (100$)<br><small>Для сну</small></div>
            </button>
            
            <h3>Їжа (Псується!)</h3>
            <button class="btn" onclick="buyFood('pizza', 20)">
                <div class="btn-icon">🍕</div>
                <div><b>Піца</b> (20$)<br><small>Термін: 30 сек</small></div>
            </button>
            <button class="btn" onclick="buyFood('sushi', 35)">
                <div class="btn-icon">🍣</div>
                <div><b>Суші</b> (35$)<br><small>Термін: 15 сек (Швидко псується!)</small></div>
            </button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)"><i class="ri-home-5-line"></i></button>
        <button class="nav-btn" onclick="switchTab('inv', this)"><i class="ri-backpack-line"></i></button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><i class="ri-shopping-cart-2-line"></i></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let game = {
            money: 300, energy: 100, health: 100,
            inventory: [] // Тут тепер і їжа, і техніка
        };

        if(localStorage.getItem('simSpoil')) game = JSON.parse(localStorage.getItem('simSpoil'));

        // --- ЛОГІКА ПСУВАННЯ ---
        setInterval(() => {
            // Перевіряємо кожну секунду стан їжі
            let needsRender = false;
            const now = Date.now();

            game.inventory.forEach(item => {
                if (item.category === 'food' && !item.isSpoiled) {
                    // Якщо час вийшов - їжа псується
                    if (now > item.expireTime) {
                        item.isSpoiled = true;
                        item.name = "Зіпсовано (" + item.originalName + ")";
                        tg.showAlert(`🤮 Твій ${item.originalName} зіпсувався!`);
                        needsRender = true;
                    }
                }
            });

            if(needsRender) { render(); save(); }
            
            // Якщо ми на вкладці інвентарю - оновлюємо смужки часу в реальному часі
            if(document.getElementById('tab-inv').classList.contains('active')) {
                renderInventory();
            }
        }, 1000);

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;
            document.getElementById('health').innerText = game.health;

            // Візуал кімнати (тільки техніка)
            const hasPC = game.inventory.some(i => i.id === 'pc' && i.hp > 0);
            const hasBed = game.inventory.some(i => i.id === 'bed' && i.hp > 0);
            
            document.getElementById('item-pc').style.display = hasPC ? 'block' : 'none';
            document.getElementById('item-bed').style.display = hasBed ? 'block' : 'none';
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = "";
            const now = Date.now();

            if (game.inventory.length === 0) list.innerHTML = "<div style='text-align:center;color:gray'>Пусто</div>";

            game.inventory.forEach((item, index) => {
                let cardHTML = "";

                // --- 1. ТЕХНІКА (Знос) ---
                if (item.category === 'device') {
                    const barColor = item.hp > 50 ? '#2ecc71' : '#e74c3c';
                    let btn = item.hp <= 0 
                        ? `<button class="action-btn-small" style="background:#e67e22" onclick="repair(${index})">🔧 Ремонт (50$)</button>`
                        : `<div style="font-size:10px; color:gray; margin-top:5px;">Використовується...</div>`;
                    
                    cardHTML = `
                        <div class="inv-card">
                            <div class="inv-header"><div>${item.name}</div><div>${item.hp}%</div></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${item.hp}%; background:${barColor}"></div></div>
                            ${btn}
                        </div>`;
                }

                // --- 2. ЇЖА (Час) ---
                if (item.category === 'food') {
                    if (item.isSpoiled) {
                        // ЗІПСОВАНА
                        cardHTML = `
                        <div class="inv-card food-spoiled">
                            <div class="inv-header"><div>🤢 ${item.name}</div><div style="color:red">Сміття</div></div>
                            <button class="action-btn-small" style="background:#444" onclick="trash(${index})">🗑️ Викинути</button>
                        </div>`;
                    } else {
                        // СВІЖА
                        const totalLife = item.totalLife;
                        const timeLeft = Math.max(0, item.expireTime - now);
                        const percent = (timeLeft / totalLife) * 100;
                        
                        cardHTML = `
                        <div class="inv-card food-fresh">
                            <div class="inv-header"><div>🥣 ${item.name}</div><div>${Math.ceil(timeLeft/1000)} сек</div></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${percent}%; background:#3498db"></div></div>
                            <button class="action-btn-small" style="background:#2ecc71" onclick="eat(${index})">🍽️ З'їсти</button>
                        </div>`;
                    }
                }
                list.innerHTML += cardHTML;
            });
        }

        // --- ACTIONS ---
        function work() {
            const pc = game.inventory.find(i => i.id === 'pc');
            if (!pc || pc.hp <= 0) return alert("Потрібен робочий ПК!");
            if (game.energy < 10) return alert("Втомився!");
            
            showOverlay("👨‍💻", "КОДИНГ...");
            setTimeout(() => {
                game.money += 15; game.energy -= 10;
                pc.hp -= 10; // Знос
                finishAction();
            }, 2000);
        }

        function sleep() {
            const bed = game.inventory.find(i => i.id === 'bed');
            if (!bed || bed.hp <= 0) return alert("Потрібне ціле ліжко!");
            
            showOverlay("😴", "СОН...");
            setTimeout(() => {
                game.energy = Math.min(100, game.energy + 20);
                bed.hp -= 5; // Знос
                finishAction();
            }, 2000);
        }

        function showOverlay(emoji, text) {
            document.getElementById('overlay-emoji').innerText = emoji;
            document.getElementById('overlay-text').innerText = text;
            document.getElementById('overlay').style.display = 'flex';
        }

        function finishAction() {
            document.getElementById('overlay').style.display = 'none';
            save(); render();
        }

        // --- SHOP & ITEMS ---
        function buyItem(id, price) {
            if (game.inventory.some(i => i.id === id)) return alert("Вже є!");
            if (game.money < price) return alert("Нема грошей");
            
            game.money -= price;
            game.inventory.push({
                id: id, name: id === 'pc' ? 'ПК' : 'Ліжко',
                category: 'device', hp: 100
            });
            save(); render(); alert("Куплено!");
        }

        function buyFood(type, price) {
            if (game.money < price) return alert("Нема грошей");
            
            game.money -= price;
            
            // Налаштування часу життя (в секундах)
            let lifeSeconds = type === 'pizza' ? 30 : 15; 
            
            game.inventory.push({
                id: type, 
                name: type === 'pizza' ? 'Піца' : 'Суші',
                originalName: type === 'pizza' ? 'Піца' : 'Суші',
                category: 'food',
                expireTime: Date.now() + (lifeSeconds * 1000), // Час смерті
                totalLife: lifeSeconds * 1000,
                isSpoiled: false
            });
            save(); render(); alert("Куплено! Їж швидше!");
        }

        // --- FOOD LOGIC ---
        function eat(index) {
            const item = game.inventory[index];
            game.inventory.splice(index, 1); // Видаляємо з інвентарю
            
            game.energy = Math.min(100, game.energy + 20);
            game.health = Math.min(100, game.health + 5);
            alert("Смачно! +Енергія");
            
            save(); render(); renderInventory();
        }

        function trash(index) {
            game.inventory.splice(index, 1);
            alert("Викинуто у смітник.");
            save(); render(); renderInventory();
        }

        function repair(index) {
            if(game.money < 50) return alert("Треба 50$");
            game.money -= 50;
            game.inventory[index].hp = 100;
            alert("Відремонтовано!");
            save(); render(); renderInventory();
        }

        // NAV
        window.switchTab = function(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tab).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tab === 'inv') renderInventory();
        }

        function save() { localStorage.setItem('simSpoil', JSON.stringify(game)); }
        render();

    </script>
</body>
</html>
