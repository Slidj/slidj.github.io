<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub UA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР */
        #player-area { 
            display: none; 
            position: sticky; top: 0; background: #000; z-index: 100; 
            width: 100%; border-bottom: 1px solid #333;
        }
        .iframe-container {
            position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000;
        }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .control-bar { padding: 12px; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; }
        .btn-close { 
            background: #d32f2f; color: white; border: none; 
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* ШАПКА */
        .header { 
            padding: 15px; background: #0f0f0f; border-bottom: 1px solid #2a2a2a; 
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
        .logo span { color: #ff0000; }
        .region { font-size: 12px; background: #333; padding: 4px 8px; border-radius: 4px; color: #aaa; }

        /* СПИСОК */
        .list { padding: 0; display: flex; flex-direction: column; }
        
        .card { 
            margin-bottom: 15px; cursor: pointer; background: #0f0f0f;
        }
        .card:active { background: #1f1f1f; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #222; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px 12px 5px 12px; display: flex; gap: 12px; }
        .details { flex-grow: 1; }
        .title { font-size: 15px; font-weight: 500; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .sub { color: #aaa; font-size: 13px; }
        .stat { color: #888; font-size: 12px; margin-top: 4px; }

        .error-box { padding: 20px; text-align: center; color: #ff5252; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="iframe-container">
            <div id="player-placeholder"></div>
        </div>
        <div class="control-bar">
            <span>Відтворення</span>
            <button class="btn-close" onclick="closePlayer()">Закрити</button>
        </div>
    </div>

    <div class="header">
        <div class="logo">Media<span>Hub</span></div>
        <div class="region">UA Trends</div>
    </div>

    <div id="list" class="list">
        <div style="padding:20px; text-align:center; color:#666;">Завантаження трендів...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ==========================================
        // ВСТАВТЕ ВАШ КЛЮЧ СЮДИ МІЖ ЛАПКАМИ ''
        const API_KEY = 'AIzaSyDRPOH3nk1h-pEdGaPmWG9r0hwgzKcgt7A'; 
        // ==========================================

        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');

        async function init() {
            // Перевірка наявності ключа
            if (!API_KEY) {
                listEl.innerHTML = `
                    <div class="error-box">
                        <h3>Потрібен ключ!</h3>
                        <p>Щоб бачити реальні тренди, вставте Google API Key у рядок 87 (всередині index.html).</p>
                    </div>`;
                return;
            }

            try {
                // Запит до YouTube: Найпопулярніші відео в Україні (regionCode=UA)
                const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=UA&maxResults=20&key=${API_KEY}`;
                
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                renderList(data.items);

            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="error-box">Помилка API: ${e.message}</div>`;
            }
        }

        function renderList(videos) {
            listEl.innerHTML = '';
            videos.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card';
                
                const snip = item.snippet;
                const stats = item.statistics;
                
                // Форматуємо цифри (наприклад 1.2M)
                const views = formatViews(stats.viewCount);

                el.innerHTML = `
                    <div class="thumb-wrapper">
                        <img class="thumb" src="${snip.thumbnails.medium.url}">
                    </div>
                    <div class="info">
                        <div class="details">
                            <div class="title">${snip.title}</div>
                            <div class="sub">${snip.channelTitle}</div>
                            <div class="stat">${views} переглядів</div>
                        </div>
                    </div>
                `;
                el.onclick = () => playVideo(item.id);
                listEl.appendChild(el);
            });
        }

        function playVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            
            placeholder.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&modestbranding=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function closePlayer() {
            placeholder.innerHTML = ''; 
            playerArea.style.display = 'none';
        }

        function formatViews(num) {
            if (!num) return "0";
            if (num > 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num > 1000) return (num / 1000).toFixed(0) + 'K';
            return num;
        }

        init();
    </script>
</body>
</html>
