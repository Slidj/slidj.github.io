<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Sim</title>
    <style>
        body { margin: 0; padding: 0; background: #202020; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #game-container { width: 100vw; height: 100vh; }
        
        /* UI зверху (Стати) */
        #ui-layer {
            position: fixed; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 10px; pointer-events: none;
        }
        .stat-box {
            background: rgba(0,0,0,0.7); color: white; padding: 5px 10px;
            border-radius: 8px; flex: 1; border: 2px solid #444;
        }
        .bar-container {
            width: 100%; height: 6px; background: #333; margin-top: 5px; border-radius: 3px;
        }
        .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        #energy-fill { background: #ffcc00; width: 100%; }
        #hunger-fill { background: #ff4444; width: 100%; }

        /* Гроші */
        #money-box {
            position: fixed; top: 10px; right: 10px;
            background: #28a745; color: white; padding: 8px 15px;
            border-radius: 20px; font-weight: bold; border: 2px solid #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Кнопка дії (з'являється, коли підходиш до меблів) */
        #interact-btn {
            display: none; /* Спочатку прихована */
            position: fixed; bottom: 120px; right: 30px;
            background: white; color: black;
            padding: 10px 20px; border-radius: 20px;
            font-weight: bold; border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; pointer-events: auto; animation: popIn 0.2s;
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="stat-box">
            ⚡ Енергія
            <div class="bar-container"><div id="energy-fill" class="bar-fill"></div></div>
        </div>
        <div class="stat-box">
            🍔 Ситість
            <div class="bar-container"><div id="hunger-fill" class="bar-fill"></div></div>
        </div>
    </div>

    <div id="money-box">0 $</div>

    <div id="interact-btn" onclick="doInteraction()">Дія</div>

    <script src="game.js?v=sims1"></script>

    <script>
        // Функції для оновлення HTML з гри
        window.updateStats = (energy, hunger, money) => {
            document.getElementById('energy-fill').style.width = energy + '%';
            document.getElementById('hunger-fill').style.width = hunger + '%';
            document.getElementById('money-box').innerText = money + ' $';
        };

        window.showButton = (text, action) => {
            const btn = document.getElementById('interact-btn');
            btn.innerText = text;
            btn.style.display = 'block';
            window.currentAction = action;
        };

        window.hideButton = () => {
            document.getElementById('interact-btn').style.display = 'none';
            window.currentAction = null;
        };

        function doInteraction() {
            if (window.gameScene && window.currentAction) {
                window.gameScene.triggerAction(window.currentAction);
            }
        }
    </script>
</body>
</html>
