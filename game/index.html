<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tube App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #1c1c1e; color: #fff; font-family: sans-serif; }
        
        /* Плеєр */
        #player-box { 
            display: none; 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 99; 
        }
        video { width: 100%; display: block; }
        .close-btn { 
            width: 100%; padding: 15px; background: #ff3b30; 
            color: white; border: none; font-weight: bold; cursor: pointer;
        }

        /* Список */
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #2c2c2e; border-radius: 10px; overflow: hidden; cursor: pointer; }
        .thumb { width: 100%; height: 180px; object-fit: cover; background: #333; }
        .info { padding: 10px; }
        .title { font-weight: bold; margin-bottom: 5px; }
        .sub { color: #aaa; font-size: 0.9em; }
        
        /* Статус */
        #status { padding: 10px; text-align: center; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="player-box">
        <video id="video-el" controls playsinline autoplay></video>
        <button class="close-btn" onclick="closeVideo()">ЗАКРИТИ</button>
    </div>

    <div id="status">Ініціалізація...</div>

    <div class="list" id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. СПИСОК СЕРВЕРІВ (Якщо один не працює, спробуйте поміняти місцями)
        // Invidious API часто стабільніші за Piped для списків
        const API_URL = 'https://inv.bp.projectsegfau.lt/api/v1/trending?region=UA';
        // const API_URL = 'https://invidious.jing.rocks/api/v1/trending?region=UA';

        // 2. ЗАПАСНІ ВІДЕО (Якщо інтернет не працює)
        const FALLBACK_VIDEOS = [
            { title: "Запасне: Природа (тест)", author: "Nature", videoId: "LXb3EKWsInQ", thumb: "https://img.youtube.com/vi/LXb3EKWsInQ/hqdefault.jpg" },
            { title: "Запасне: Музика Lofi", author: "Lofi Girl", videoId: "jfKfPfyJRdk", thumb: "https://img.youtube.com/vi/jfKfPfyJRdk/hqdefault.jpg" },
            { title: "Запасне: Кіберпанк", author: "Music", videoId: "P1k500i7m40", thumb: "https://img.youtube.com/vi/P1k500i7m40/hqdefault.jpg" }
        ];

        const listEl = document.getElementById('list');
        const statusEl = document.getElementById('status');
        const playerBox = document.getElementById('player-box');
        const videoEl = document.getElementById('video-el');

        async function start() {
            statusEl.innerText = "Завантаження трендів...";
            
            try {
                // Пробуємо отримати дані з інтернету
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Server Error");
                
                const data = await res.json();
                statusEl.innerText = "Тренди YouTube (Онлайн)";
                render(data); // Invidious віддає масив об'єктів
                
            } catch (e) {
                // ЯКЩО ПОМИЛКА - ВАНТАЖИМО ЗАПАСНІ
                console.error(e);
                statusEl.innerHTML = `<span style="color:orange">Помилка з'єднання: ${e.message}.<br>Показано тестові відео.</span>`;
                render(FALLBACK_VIDEOS);
            }
        }

        function render(videos) {
            listEl.innerHTML = '';
            videos.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                // Invidious і Piped мають трохи різні поля, унифікуємо:
                const title = v.title;
                const author = v.author || v.uploaderName || "Unknown";
                // Якщо це Invidious, там videoId, якщо Piped - url
                let id = v.videoId; 
                if (!id && v.url) id = v.url.split('v=')[1];
                
                // Картинка: беремо з об'єкта або генеруємо стандартну
                let thumb = v.thumb || v.thumbnail || `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
                // Якщо картинка прийшла як масив (Invidious)
                if (Array.isArray(v.videoThumbnails)) thumb = v.videoThumbnails[1].url;

                el.innerHTML = `
                    <img class="thumb" src="${thumb}">
                    <div class="info">
                        <div class="title">${title}</div>
                        <div class="sub">${author}</div>
                    </div>
                `;
                el.onclick = () => play(id);
                listEl.appendChild(el);
            });
        }

        async function play(id) {
            playerBox.style.display = 'block';
            window.scrollTo(0,0);
            statusEl.innerText = "Отримання посилання на відео...";

            // Для плеєра використовуємо стабільний Piped інстанс
            const STREAM_API = `https://pipedapi.kavin.rocks/streams/${id}`;

            try {
                const res = await fetch(STREAM_API);
                const data = await res.json();
                // Шукаємо mp4
                const stream = data.videoStreams.find(s => s.format === 'MPEG-4' && !s.videoOnly);
                
                if (stream) {
                    videoEl.src = stream.url;
                    statusEl.innerText = "Відтворення...";
                } else {
                    alert("Потік не знайдено!");
                    closeVideo();
                }
            } catch (e) {
                alert("Не вдалося завантажити відеофайл. Сервер перевантажений.");
                closeVideo();
            }
        }

        function closeVideo() {
            videoEl.pause();
            videoEl.src = "";
            playerBox.style.display = 'none';
            statusEl.innerText = "";
        }

        start();
    </script>
</body>
</html>
