<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life OS v22 Fix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { --bg: #000; --card: #1c1c1e; --accent: #0a84ff; --text: #fff; --green: #30d158; --red: #ff453a; --orange: #ff9f0a; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 120px; user-select: none; -webkit-tap-highlight-color: transparent; }

        .reset-btn { position: fixed; top: 10px; right: 10px; z-index: 10000; background: rgba(255, 69, 58, 0.3); color: white; border: 1px solid var(--red); padding: 5px 10px; border-radius: 8px; font-size: 10px; cursor: pointer; }

        /* SCENE */
        .scene-container { 
            position: relative; width: 100%; height: 260px; 
            background-color: #2c2c2e; 
            /* Спробуй поки без картинки, щоб перевірити роботу */
            /* background-image: url('images/bg-home.svg'); background-size: cover; */
            border-bottom: 1px solid #333; overflow: hidden; 
        }
        #visual-hero { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 70px; z-index: 10; transition: 0.5s; }
        .room-item { position: absolute; font-size: 50px; display: none; z-index: 5; }
        #item-pc { right: 30px; bottom: 40px; }
        #item-bed { left: 30px; bottom: 40px; }

        /* OVERLAY */
        #scene-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; color: white;
        }
        .overlay-emoji { font-size: 60px; margin-bottom: 10px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* UI */
        .ui { padding: 20px; }
        .widget-header { background: #1c1c1e; padding: 20px; border-radius: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; border: 1px solid #333; }
        
        /* GRIDS */
        .app-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .shop-list { display: flex; flex-direction: column; gap: 15px; }

        /* APP CARD */
        .app-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .app-card:active .icon-wrapper { transform: scale(0.95); }
        .icon-wrapper { position: relative; width: 72px; height: 72px; display: flex; justify-content: center; align-items: center; }
        .app-bg { width: 50px; height: 50px; background: var(--card); border-radius: 12px; display: flex; justify-content: center; align-items: center; z-index: 1; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #333; }
        .app-emoji { font-size: 24px; }
        
        /* RINGS */
        .progress-svg { position: absolute; top: 0; left: 0; width: 72px; height: 72px; transform: rotate(-90deg); z-index: 2; pointer-events: none; }
        .ring-bg { fill: none; stroke: #333; stroke-width: 4; }
        .ring-hp { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.3s; }
        .ring-timer { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; opacity: 0; transition: opacity 0.2s; }
        .ring-timer.active { opacity: 1; }

        .app-label { font-size: 11px; margin-top: 5px; color: #fff; font-weight: 500; }
        .app-badge { position: absolute; bottom: -8px; z-index: 3; font-size: 9px; font-weight: bold; padding: 2px 6px; background: #333; border-radius: 10px; border: 2px solid var(--bg); color: #ccc; min-width: 20px; text-align: center; }

        /* SHOP CARD */
        .shop-card { background: var(--card); border-radius: 16px; border: 1px solid #333; display: flex; overflow: hidden; min-height: 110px; }
        .shop-visual { width: 90px; background: linear-gradient(135deg, #2a2a2a, #1a1a1a); display: flex; justify-content: center; align-items: center; font-size: 40px; border-right: 1px solid #333; }
        .shop-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .shop-title { font-weight: bold; font-size: 15px; }
        .shop-price { font-weight: bold; color: var(--green); font-size: 14px; }
        .shop-desc { font-size: 11px; color: #888; margin-bottom: 8px; line-height: 1.3; }
        .shop-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .tag { font-size: 9px; padding: 3px 6px; border-radius: 4px; background: #333; color: #ccc; font-weight: 500; }
        .tag-green { color: var(--green); background: rgba(48, 209, 88, 0.1); }
        .tag-red { color: var(--red); background: rgba(255, 69, 58, 0.1); }
        .tag-orange { color: var(--orange); background: rgba(255, 159, 10, 0.1); }
        .tag-blue { color: var(--accent); background: rgba(10, 132, 255, 0.1); }
        
        .shop-btn { background: var(--accent); color: white; border: none; padding: 8px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto; font-size: 13px; }
        .shop-btn:disabled { background: #333; color: #555; }

        /* TABS */
        .tab { display: none; } .tab.active { display: block; }
        
        /* NAV - ВИПРАВЛЕНО Z-INDEX та ІКОНКИ */
        .nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: #111; display: flex; padding: 15px 0; 
            border-top: 1px solid #333; z-index: 9999; /* Максимальний шар */
        }
        .nav-btn { 
            flex: 1; background: none; border: none; 
            font-size: 28px; /* Емодзі більші */
            cursor: pointer; opacity: 0.5; transition: 0.2s;
        }
        .nav-btn.active { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body>

    <button class="reset-btn" onclick="hardReset()">RESET v22</button>

    <div class="scene-container">
        <div id="scene-overlay">
            <div class="overlay-emoji" id="overlay-icon">⏳</div>
            <div id="overlay-text">ДІЯ...</div>
        </div>
        <div id="item-pc" class="room-item">🖥️</div>
        <div id="item-bed" class="room-item">🛏️</div>
        <div id="visual-hero">🧍</div>
    </div>

    <div class="ui">
        <div class="widget-header">
            <div><div style="font-size:28px;font-weight:800;color:#30d158"><span id="money">0</span> $</div><div style="font-size:12px;color:#666">Фінанси</div></div>
            <div style="font-weight:bold;color:var(--green)">⚡ <span id="energy">100</span>%</div>
        </div>

        <div id="tab-home" class="tab active">
            <div style="color:#666;font-size:12px;margin-bottom:10px">КІМНАТА</div>
            <div id="home-grid" class="app-grid"></div>
            <div id="empty-home-msg" style="text-align:center; color:#555; margin-top:20px; display:none;">У кімнаті пусто.<br>Купи меблі в магазині!</div>
        </div>

        <div id="tab-inv" class="tab">
            <div style="color:#666;font-size:12px;margin-bottom:10px">РЮКЗАК</div>
            <div id="inventory-grid" class="app-grid"></div>
        </div>

        <div id="tab-shop" class="tab">
            <div style="color:#666;font-size:12px;margin-bottom:10px">МАРКЕТПЛЕЙС</div>
            <div id="shop-container" class="shop-list"></div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home', this)">🏠</button>
        <button class="nav-btn" onclick="switchTab('inv', this)">🎒</button>
        <button class="nav-btn" onclick="switchTab('shop', this)">🛒</button>
    </div>

    <script>
        const shopItems = [
            { id: 'pc', type: 'device', name: 'iMac Pro', price: 150, icon: '🖥️', desc: 'Для заробітку.', specs: [{t:'⚡ -10',c:'tag-red'},{t:'💰 +20$',c:'tag-green'}] },
            { id: 'bed', type: 'device', name: 'Smart Bed', price: 100, icon: '🛏️', desc: 'Відновлює сили.', specs: [{t:'⚡ +30',c:'tag-green'},{t:'⏳ 3с',c:'tag-blue'}] },
            { id: 'pizza', type: 'food', name: 'Pepperoni', price: 20, icon: '🍕', desc: 'Дає енергію.', specs: [{t:'⚡ +20',c:'tag-green'},{t:'Термін 30с',c:'tag-orange'}] },
            { id: 'sushi', type: 'food', name: 'Sushi', price: 45, icon: '🍣', desc: 'Смачна риба.', specs: [{t:'⚡ +35',c:'tag-green'},{t:'Термін 15с',c:'tag-red'}] }
        ];

        let game;

        document.addEventListener("DOMContentLoaded", () => {
            try {
                const saved = localStorage.getItem('lifeSim_v22');
                if(saved) game = JSON.parse(saved);
                else game = { money: 300, energy: 100, inventory: [] };
                if(!game.inventory) game.inventory = [];
            } catch(e) { game = { money: 300, energy: 100, inventory: [] }; }

            const tg = window.Telegram.WebApp;
            tg.expand();

            // ПРИМУСОВИЙ ПЕРШИЙ РЕНДЕР ВСЬОГО
            render(); 
            renderHome(); 
            renderShop();
            renderGrid();

            setInterval(gameLoop, 1000);
        });

        function gameLoop() {
            const now = Date.now();
            let saveNeeded = false;
            game.inventory.forEach(item => {
                if(item.category==='food' && !item.isSpoiled && now > item.expireTime) {
                    item.isSpoiled = true; saveNeeded = true;
                }
            });
            if(saveNeeded) { save(); render(); renderGrid(); }
            
            // Оновлюємо таймери на активній вкладці
            if(document.getElementById('tab-home').classList.contains('active')) renderHome();
            if(document.getElementById('tab-inv').classList.contains('active')) renderGrid();
        }

        function render() {
            document.getElementById('money').innerText = game.money;
            document.getElementById('energy').innerText = game.energy;

            const pc = game.inventory.find(i => i.id === 'pc');
            const bed = game.inventory.find(i => i.id === 'bed');
            
            const pcEl = document.getElementById('item-pc');
            if(pc) { pcEl.style.display='block'; pcEl.className = pc.hp<=0?'room-item broken-visual':'room-item'; } else { pcEl.style.display='none'; }
            
            const bedEl = document.getElementById('item-bed');
            if(bed) { bedEl.style.display='block'; bedEl.className = bed.hp<=0?'room-item broken-visual':'room-item'; } else { bedEl.style.display='none'; }
        }

        function renderHome() {
            const grid = document.getElementById('home-grid');
            // Примітка: Повна перемальовка може збивати CSS анімацію якщо часто викликати, але для надійності поки так.
            // Краще було б оновлювати тільки цифри, але це складніше.
            if(isBusy) return; // Не перемальовуємо, якщо йде анімація дії, щоб не збити її

            grid.innerHTML = "";
            const devices = game.inventory.filter(i => i.category === 'device');
            
            if(devices.length === 0) {
                document.getElementById('empty-home-msg').style.display = 'block';
            } else {
                document.getElementById('empty-home-msg').style.display = 'none';
                devices.forEach(item => {
                    let hpColor = item.hp > 50 ? '#30d158' : (item.hp > 20 ? '#ff9f0a' : '#ff453a');
                    let hpOffset = 163 - (163 * item.hp / 100);
                    let icon = item.id === 'pc' ? '🖥️' : '🛏️';
                    let action = item.id === 'pc' ? 'work' : 'sleep';
                    
                    grid.innerHTML += `
                    <div class="app-card" onclick="startAction('${item.id}', '${action}')">
                        <div class="icon-wrapper">
                            <div class="app-bg"><span class="app-emoji">${icon}</span></div>
                            <svg class="progress-svg" viewBox="0 0 72 72">
                                <circle class="ring-bg" cx="36" cy="36" r="26" opacity="0.3"></circle>
                                <circle class="ring-hp" cx="36" cy="36" r="26" stroke="${hpColor}" stroke-dasharray="163" stroke-dashoffset="${hpOffset}"></circle>
                                <circle class="ring-timer" id="timer-${item.id}" cx="36" cy="36" r="32" stroke-dasharray="200" stroke-dashoffset="0"></circle>
                            </svg>
                            <div class="app-badge" id="badge-${item.id}">${item.hp}%</div>
                        </div>
                        <div class="app-label">${item.name}</div>
                    </div>`;
                });
            }
        }

        function renderShop() {
            const container = document.getElementById('shop-container');
            container.innerHTML = "";
            shopItems.forEach(item => {
                let tags = item.specs.map(s => `<span class="tag ${s.c}">${s.t}</span>`).join('');
                let btnTxt = `Купити ${item.price}$`;
                let dis = false;
                if (item.type === 'device' && game.inventory.some(i => i.id === item.id)) { btnTxt="Вже є"; dis=true; }
                else if (game.money < item.price) { btnTxt=`Треба ${item.price}$`; dis=true; }

                container.innerHTML += `
                <div class="shop-card">
                    <div class="shop-visual">${item.icon}</div>
                    <div class="shop-info">
                        <div class="shop-header"><span class="shop-title">${item.name}</span><span class="shop-price">${item.price}$</span></div>
                        <div class="shop-desc">${item.desc}</div>
                        <div class="shop-tags">${tags}</div>
                        <button class="shop-btn" onclick="buy('${item.id}')" ${dis?'disabled':''}>${btnTxt}</button>
                    </div>
                </div>`;
            });
        }

        function renderGrid() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";
            const foods = game.inventory.filter(i => i.category === 'food');
            if(foods.length === 0) grid.innerHTML = "<div style='color:#555;grid-column:1/-1;text-align:center'>Рюкзак пустий</div>";
            
            foods.forEach((item) => {
                let emoji = item.id==='pizza'?'🍕':'🍣';
                let badge = "";
                let color = "#30d158";
                let offset = 0;

                if(item.isSpoiled) { emoji="🤢"; color="#555"; badge="🗑️"; offset=163; }
                else {
                    const left = Math.max(0, item.expireTime - Date.now());
                    badge = Math.ceil(left/1000)+"с"; color="#0a84ff";
                    offset = 163 - (163 * (left/item.totalLife));
                }

                grid.innerHTML += `
                <div class="app-card" onclick="useFood('${item.id}')">
                    <div class="icon-wrapper">
                        <div class="app-bg"><span class="app-emoji">${emoji}</span></div>
                        <svg class="progress-svg" viewBox="0 0 72 72">
                            <circle cx="36" cy="36" r="26" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="${offset}"></circle>
                        </svg>
                        <div class="app-badge">${badge}</div>
                    </div>
                    <div class="app-label">${item.name}</div>
                </div>`;
            });
        }

        // ACTIONS
        let isBusy = false;

        function startAction(itemId, type) {
            if(isBusy) return;
            const item = game.inventory.find(i => i.id === itemId);
            if(item.hp <= 0) { 
                if(game.money >= 50 && confirm("Предмет зламаний. Ремонт 50$?")) {
                    game.money -= 50; item.hp = 100; save(); render(); renderHome();
                }
                return;
            }
            if(game.energy < 10) return alert("Втома!");

            isBusy = true;
            
            const timerRing = document.getElementById(`timer-${itemId}`);
            const badge = document.getElementById(`badge-${itemId}`);
            if(timerRing) timerRing.classList.add('active');
            
            let start = Date.now();
            let duration = 3000;
            
            let int = setInterval(() => {
                let p = Date.now() - start;
                let left = Math.max(0, duration - p);
                let offset = 200 - (200 * (left/duration));
                
                if(timerRing) timerRing.style.strokeDashoffset = -offset;
                if(badge) badge.innerText = (left/1000).toFixed(1) + 'с';
                
                if(left <= 0) {
                    clearInterval(int);
                    if(timerRing) timerRing.classList.remove('active');
                    if(badge) badge.innerText = (item.hp - (type==='work'?20:5)) + '%';
                }
            }, 30);

            const ov = document.getElementById('scene-overlay');
            document.getElementById('overlay-icon').innerText = type==='work'?'👨‍💻':'😴';
            document.getElementById('overlay-text').innerText = type==='work'?'КОДИНГ':'СОН';
            ov.style.display = 'flex';

            setTimeout(() => {
                if(type==='work') { game.money+=20; game.energy-=10; item.hp-=20; }
                if(type==='sleep') { game.energy+=30; item.hp-=5; }
                
                ov.style.display = 'none';
                isBusy = false;
                save(); render(); renderHome();
            }, duration);
        }

        function useFood(itemId) {
            const idx = game.inventory.findIndex(i => i.id === itemId && i.category === 'food');
            if(idx === -1) return;
            const item = game.inventory[idx];
            if(item.isSpoiled) { game.inventory.splice(idx, 1); } 
            else { game.inventory.splice(idx, 1); game.energy = Math.min(100, game.energy + 20); }
            save(); render(); renderGrid();
        }

        function buy(id) {
            const meta = shopItems.find(x => x.id === id);
            if(game.money < meta.price) return;
            game.money -= meta.price;
            
            if(meta.type === 'device') {
                game.inventory.push({id:meta.id, name:meta.name, category:'device', hp:100});
            } else {
                let time = id==='pizza'?30000:15000;
                game.inventory.push({id:meta.id, name:meta.name, category:'food', expireTime:Date.now()+time, totalLife:time, isSpoiled:false});
            }
            save(); render(); renderShop(); renderHome(); renderGrid();
            alert("Куплено!");
        }

        function save() { localStorage.setItem('lifeSim_v22', JSON.stringify(game)); }
        window.hardReset = function() { localStorage.clear(); location.reload(); }
        
        window.switchTab = function(tabName, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-'+tabName).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(tabName === 'home') renderHome();
            if(tabName === 'inv') renderGrid();
            if(tabName === 'shop') renderShop();
        };
    </script>
</body>
</html>
