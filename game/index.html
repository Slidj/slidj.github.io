<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Debug</title>
    
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header { padding: 15px; background: #1e222d; display: flex; justify-content: space-between; }
        
        /* 2. Даємо контейнеру колір, щоб бачити його межі, якщо графік не прогрузиться */
        #chart-container {
            flex-grow: 1;
            width: 100%;
            background-color: #2a2e39; /* Тимчасовий фон */
            position: relative;
        }
        
        .controls { padding: 20px; background: #1e222d; display: flex; gap: 10px; min-height: 60px; }
        button { flex: 1; padding: 15px; border-radius: 8px; border: none; font-weight: bold; color: white; }
        .btn-up { background: #089981; }
        .btn-down { background: #f23645; }
    </style>
</head>
<body>

    <script>
        window.onerror = function(msg, url, line) {
            alert("Помилка: " + msg + "\nРядок: " + line);
        };
    </script>

    <div class="header">
        <span>BTC/USDT</span>
        <span id="price">Loading...</span>
    </div>

    <div id="chart-container"></div>

    <div class="controls">
        <button class="btn-up" onclick="alert('UP')">UP</button>
        <button class="btn-down" onclick="alert('DOWN')">DOWN</button>
    </div>

    <script>
        // Перевірка, чи завантажилась бібліотека
        if (!window.LightweightCharts) {
            alert("Бібліотека графіків не завантажилась! Перевір інтернет.");
        }

        const container = document.getElementById('chart-container');
        
        // Створюємо графік
        const chart = LightweightCharts.createChart(container, {
            // Важливо: задаємо авто-розмір
            width: container.clientWidth,
            height: container.clientHeight,
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2a2e39' },
                horzLines: { color: '#2a2e39' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: true,
            },
        });

        const series = chart.addAreaSeries({
            lineColor: '#2962FF',
            topColor: '#2962FF',
            bottomColor: 'rgba(41, 98, 255, 0.28)',
        });

        // Адаптивність при зміні розміру вікна
        window.onresize = function() {
            chart.applyOptions({ 
                width: container.clientWidth,
                height: container.clientHeight 
            });
        };

        // Підключення до Binance
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        const priceLabel = document.getElementById('price');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const price = parseFloat(data.p);
            
            priceLabel.innerText = price.toFixed(2);
            
            series.update({
                time: data.T / 1000,
                value: price
            });
        };
    </script>
</body>
</html>
