<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* ПЛЕЄР */
        #player-area { 
            display: none; 
            position: sticky; 
            top: 0; 
            background: #000; 
            z-index: 100; 
            width: 100%;
            border-bottom: 2px solid #333;
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .control-bar { padding: 10px; display: flex; justify-content: space-between; align-items: center; background: #1f1f1f; }
        .btn-close { 
            background: #d32f2f; color: white; border: none; 
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        /* СПИСОК */
        .header { padding: 15px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; background: #121212;}
        
        .list { padding: 10px; display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #1e1e1e; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
            transition: transform 0.1s;
        }
        .card:active { transform: scale(0.98); background: #333; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .duration { 
            position: absolute; bottom: 8px; right: 8px; 
            background: rgba(0,0,0,0.8); color: white; 
            padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold;
        }
        
        .info { padding: 12px; }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
        .sub { color: #aaa; font-size: 13px; display: flex; align-items: center; gap: 5px;}
        .avatar { width: 20px; height: 20px; border-radius: 50%; background: #555; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="iframe-container">
            <div id="player-placeholder"></div>
        </div>
        <div class="control-bar">
            <span>Відтворення...</span>
            <button class="btn-close" onclick="closePlayer()">Закрити</button>
        </div>
    </div>

    <div class="header">Media Hub</div>

    <div id="list" class="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- ВАШІ ВІДЕО (Можна додавати свої сюди) ---
        const VIDEOS = [
            {
                id: "LXb3EKWsInQ",
                title: "COSTA RICA IN 4K 60fps HDR (ULTRA HD)",
                author: "Jacob + Katie Schwarz",
                time: "5:14",
                img: "https://i.ytimg.com/vi/LXb3EKWsInQ/hqdefault.jpg"
            },
            {
                id: "jfKfPfyJRdk",
                title: "lofi hip hop radio - beats to relax/study to",
                author: "Lofi Girl",
                time: "LIVE",
                img: "https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg"
            },
            {
                id: "P1k500i7m40", 
                title: "Cyberpunk 2077 Music - V",
                author: "Music Lab",
                time: "3:40",
                img: "https://i.ytimg.com/vi/P1k500i7m40/hqdefault.jpg"
            },
            {
                id: "9Auq9mYxFEE",
                title: "Skyrim - The Dragonborn Comes",
                author: "Malukah",
                time: "4:24",
                img: "https://i.ytimg.com/vi/4z9TdDCWN7g/hqdefault.jpg"
            },
            {
                id: "G1IbRujko-A", 
                title: "Gundam Build Metaverse - Episode 1",
                author: "GundamInfo",
                time: "12:00",
                img: "https://i.ytimg.com/vi/G1IbRujko-A/hqdefault.jpg"
            }
        ];

        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const placeholder = document.getElementById('player-placeholder');

        // Малюємо список
        function init() {
            listEl.innerHTML = '';
            VIDEOS.forEach(v => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="thumb-wrapper">
                        <img class="thumb" src="${v.img}">
                        <div class="duration">${v.time}</div>
                    </div>
                    <div class="info">
                        <div class="title">${v.title}</div>
                        <div class="sub">
                            <div class="avatar"></div> ${v.author}
                        </div>
                    </div>
                `;
                // При кліку запускаємо плеєр
                el.onclick = () => playVideo(v.id);
                listEl.appendChild(el);
            });
        }

        // Запуск відео (Official YouTube Embed)
        function playVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);
            
            // Використовуємо офіційний плеєр - це найнадійніше
            placeholder.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            `;
        }

        function closePlayer() {
            placeholder.innerHTML = ''; 
            playerArea.style.display = 'none';
        }

        init();
    </script>
</body>
</html>
