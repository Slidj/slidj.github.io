<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* --- ЗАГАЛЬНИЙ СТИЛЬ СТОРІНКИ --- */
        body {
            background-color: #0e0e0f; /* Дуже темний фон (Deep Dark) */
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        
        /* HEADER */
        .header {
            padding: 12px 16px;
            /* Відступ зверху для безпечної зони iPhone */
            padding-top: 80px; 
            padding-top: calc(80px + env(safe-area-inset-top));
            
            background: #0e0e0f; /* Зливається з фоном */
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            min-height: 60px; 
            z-index: 20;
        }

        /* Профіль */
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: #1f1f21; object-fit: cover; border: 2px solid #1f1f21;
        }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: 700; font-size: 15px; color: #fff; line-height: 1.2; }
        .balance { font-size: 13px; color: #7d8597; font-weight: 600; } /* Сірий колір для балансу */

        /* Селектор валют */
        .market-info { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        #asset-select {
            background: #1f1f21;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            outline: none;
            margin-bottom: 4px;
            cursor: pointer;
            appearance: none; -webkit-appearance: none; text-align: center;
        }
        .price { font-size: 18px; font-weight: bold; font-family: monospace; margin-top: 2px; color: #fff; }

        /* CHART CONTAINER */
        #chart-container { flex-grow: 1; width: 100%; position: relative; }

        /* POPUP RESULT */
        #result-popup {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #1f1f21; /* Світліший фон для попапу */
            padding: 24px 40px;
            border-radius: 20px;
            text-align: center;
            opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        #result-popup.win { border: 2px solid #0ecb81; }
        #result-popup.loss { border: 2px solid #f6465d; }
        #result-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .result-amount { font-size: 28px; font-weight: 800; margin-top: 8px; color: #fff; }

        /* CONTROLS */
        .controls {
            padding: 16px;
            background: #0e0e0f;
            display: flex;
            gap: 16px;
            padding-bottom: 50px; 
        }
        .btn {
            flex: 1; height: 56px; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700; color: white; cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        /* Яскраві неонові кнопки */
        .btn-up { background-color: #0ecb81; box-shadow: 0 0 20px rgba(14, 203, 129, 0.2); }
        .btn-down { background-color: #f6465d; box-shadow: 0 0 20px rgba(246, 70, 93, 0.2); }

        .loader { border: 2px solid #2a2e39; border-top: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" class="user-avatar">
            <div class="user-info">
                <div id="user-name" class="user-name">Trader</div>
                <div class="balance" id="balance">$1,000</div>
            </div>
        </div>
        <div class="market-info">
            <select id="asset-select">
                <option value="btcusdt">BTC / USDT</option>
                <option value="ethusdt">ETH / USDT</option>
                <option value="solusdt">SOL / USDT</option>
                <option value="dogeusdt">DOGE / USDT</option>
            </select>
            <div class="price" id="price">Loading...</div>
        </div>
    </div>

    <div id="chart-container"></div>

    <div id="result-popup">
        <div id="result-title">RESULT</div>
        <div id="result-amount" class="result-amount">$0</div>
    </div>

    <div class="controls">
        <button class="btn btn-up" onclick="startTrade('UP')">Call</button>
        <button class="btn btn-down" onclick="startTrade('DOWN')">Put</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0e0e0f'); // Колір "шапки" Телеграму під фон

        // ============================================
        // 🎨 DESIGN CONFIG (НАЛАШТУВАННЯ ДИЗАЙНУ ГРАФІКА)
        // ============================================
        const THEME = {
            backgroundColor: '#0e0e0f', // Колір фону графіка (Deep Dark)
            gridColor: '#1f1f21',       // Колір сітки (майже невидима)
            textColor: '#7d8597',       // Колір цифр на шкалі
            
            // Свічки UP (Зелені)
            upColor: '#0ecb81',         
            upWickColor: '#0ecb81',
            
            // Свічки DOWN (Червоні)
            downColor: '#f6465d',
            downWickColor: '#f6465d',
            
            // Лінія перехрестя (коли водиш пальцем)
            crosshairColor: '#484d59',
        };
        // ============================================


        // --- 1. ЮЗЕР ---
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;
        }

        // --- 2. СТВОРЕННЯ ГРАФІКА ---
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: {
                background: { type: 'solid', color: THEME.backgroundColor },
                textColor: THEME.textColor,
            },
            grid: {
                vertLines: { color: THEME.gridColor },
                horzLines: { color: THEME.gridColor },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: true,
                borderColor: THEME.gridColor,
            },
            rightPriceScale: {
                borderColor: THEME.gridColor,
            },
            crosshair: {
                vertLine: { color: THEME.crosshairColor, labelBackgroundColor: THEME.crosshairColor },
                horzLine: { color: THEME.crosshairColor, labelBackgroundColor: THEME.crosshairColor },
            }
        });

        // Створюємо серію свічок з твоїми кольорами
        let series = chart.addCandlestickSeries({
            upColor: THEME.upColor,
            borderUpColor: THEME.upColor,
            wickUpColor: THEME.upWickColor,
            
            downColor: THEME.downColor,
            borderDownColor: THEME.downColor,
            wickDownColor: THEME.downWickColor,
        });

        window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);

        // --- 3. ДАНІ ---
        let ws = null;
        let currentPrice = 0;
        const priceLabel = document.getElementById('price');
        const assetSelect = document.getElementById('asset-select');

        function connectWebSocket(symbol) {
            if (ws) ws.close();
            series.setData([]);
            priceLabel.innerHTML = '<span class="loader"></span>';

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@kline_1s`);
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                const k = message.k;
                const candle = {
                    time: k.t / 1000,
                    open: parseFloat(k.o),
                    high: parseFloat(k.h),
                    low: parseFloat(k.l),
                    close: parseFloat(k.c),
                };
                currentPrice = candle.close;
                priceLabel.style.color = !window.lastPrice || currentPrice >= window.lastPrice ? THEME.upColor : THEME.downColor;
                window.lastPrice = currentPrice;
                priceLabel.innerText = currentPrice.toFixed(currentPrice < 1 ? 5 : 2);
                series.update(candle);
            };
        }

        assetSelect.addEventListener('change', (e) => connectWebSocket(e.target.value));
        connectWebSocket('btcusdt');

        // --- 4. СТАВКИ ---
        let balance = 1000;
        let isTrading = false;
        let betLine = null;

        function startTrade(direction) {
            if (isTrading) return;
            isTrading = true;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const entryPrice = currentPrice;
            const betAmount = 50;
            const lineColor = direction === 'UP' ? THEME.upColor : THEME.downColor;

            betLine = series.createPriceLine({
                price: entryPrice, color: lineColor, lineWidth: 2, lineStyle: 2, title: direction.toUpperCase(),
            });

            setTimeout(() => { finishTrade(direction, entryPrice, betAmount); }, 3000);
        }

        function finishTrade(direction, entryPrice, betAmount) {
            let win = false;
            if (direction === 'UP' && currentPrice > entryPrice) win = true;
            else if (direction === 'DOWN' && currentPrice < entryPrice) win = true;

            if (win) balance += betAmount * 0.8;
            else balance -= betAmount;

            document.getElementById('balance').innerText = `$${balance.toFixed(0)}`;
            
            if (betLine) { series.removePriceLine(betLine); betLine = null; }

            const popup = document.getElementById('result-popup');
            const title = document.getElementById('result-title');
            const amount = document.getElementById('result-amount');

            popup.className = win ? 'win show' : 'loss show';
            title.innerText = win ? 'YOU WON!' : 'YOU LOST';
            title.style.color = win ? THEME.upColor : THEME.downColor;
            amount.innerText = win ? `+$${(betAmount * 0.8).toFixed(0)}` : `-$${betAmount}`;
            
            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
            
            setTimeout(() => { popup.classList.remove('show'); isTrading = false; }, 2000);
        }
    </script>
</body>
</html>
