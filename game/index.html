<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Life Sim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene-container" id="game-scene">
        <img src="assets/item-pc.png" id="visual-pc" class="room-item" alt="PC">
        <img src="assets/item-bed.png" id="visual-bed" class="room-item" alt="Bed">
        
        <div id="visual-hero" class="room-item" style="display:block; font-size:80px; text-align:center;">
            🧍
        </div>
    </div>

    <div class="ui-container">
        <div class="header">
            <div class="money"><span id="money">0</span> $</div>
            <div style="font-size:12px; color:#888;">День 1</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">❤️ <span id="health">100</span></div>
            <div class="stat-box">⚡ <span id="energy">100</span></div>
        </div>

        <div id="tab-home" class="tab-content active">
            <button class="action-btn" onclick="startAction('work')">
                <i class="ri-computer-line btn-icon"></i>
                <div>
                    <div><b>Фріланс</b></div>
                    <div style="font-size:12px; color:#888;">+15$ | -10 Енергії</div>
                </div>
            </button>
        </div>

        <div id="tab-shop" class="tab-content">
            <button class="action-btn" onclick="buyItem('pc')">
                <i class="ri-macbook-line btn-icon"></i>
                <div>
                    <div><b>Ігровий ПК</b> (200$)</div>
                    <div style="font-size:12px; color:#888;">З'явиться в кімнаті!</div>
                </div>
            </button>
             <button class="action-btn" onclick="buyItem('bed')">
                <i class="ri-hotel-bed-line btn-icon"></i>
                <div>
                    <div><b>М'яке ліжко</b> (100$)</div>
                    <div style="font-size:12px; color:#888;">Краще відновлює сон</div>
                </div>
            </button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('home')"><i class="ri-home-line"></i></button>
        <button class="nav-btn" onclick="switchTab('shop')"><i class="ri-shopping-cart-2-line"></i></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
