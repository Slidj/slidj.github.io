<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Hub UA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; background-color: #0f0f0f; color: #fff; font-family: -apple-system, sans-serif; }
        
        /* --- 1. ПЛЕЄР (КОНТЕЙНЕР) --- */
        #player-area { 
            display: none; 
            position: sticky; top: 0; background: #000; z-index: 100; 
            width: 100%; border-bottom: 1px solid #333;
        }

        /* Місце для YouTube Iframe */
        .video-wrapper {
            position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000;
        }
        
        /* Сам Iframe (робимо його неактивним для кліків, щоб керувати своїми кнопками) */
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
            pointer-events: none; /* ВАЖЛИВО: Вимикає стандартні кліки по відео */
        }

        /* --- 2. НАШІ КАСТОМНІ КНОПКИ --- */
        .custom-controls {
            padding: 10px 15px;
            background: #1e1e1e;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* Смужка прогресу */
        .progress-bar {
            width: 100%; height: 4px; background: #444; border-radius: 2px;
            position: relative; cursor: pointer;
            padding: 5px 0; /* Збільшуємо зону кліку */
        }
        .progress-fill {
            height: 4px; background: #ff0000; width: 0%; border-radius: 2px;
            position: absolute; top: 5px; left: 0;
            transition: width 0.1s linear;
        }

        /* Рядок кнопок */
        .controls-row {
            display: flex; justify-content: space-between; align-items: center;
        }

        .left-controls { display: flex; align-items: center; gap: 15px; }

        .btn-play {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: #fff; color: #000; font-size: 16px; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        
        .time-text { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; }

        .btn-close { 
            background: transparent; color: #ff453a; border: 1px solid #ff453a; 
            padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* --- 3. ШАПКА ТА СПИСОК --- */
        .header { 
            padding: 15px; background: #0f0f0f; border-bottom: 1px solid #2a2a2a; 
            display: flex; align-items: center; justify-content: space-between;
        }
        .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
        .logo span { color: #ff0000; }
        .region { font-size: 12px; background: #333; padding: 4px 8px; border-radius: 4px; color: #aaa; }

        .list { padding: 0; display: flex; flex-direction: column; }
        
        .card { margin-bottom: 15px; cursor: pointer; background: #0f0f0f; }
        .card:active { background: #1f1f1f; }
        
        .thumb-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #222; }
        .thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px 12px 5px 12px; display: flex; gap: 12px; }
        .details { flex-grow: 1; }
        .title { font-size: 15px; font-weight: 500; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .sub { color: #aaa; font-size: 13px; }
        .stat { color: #888; font-size: 12px; margin-top: 4px; }
        .error-box { padding: 20px; text-align: center; color: #ff5252; }
    </style>
</head>
<body>

    <div id="player-area">
        <div class="video-wrapper">
            <div id="yt-placeholder"></div>
        </div>
        
        <div class="custom-controls">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="controls-row">
                <div class="left-controls">
                    <button class="btn-play" id="btn-play">▶</button>
                    <span class="time-text" id="time-text">0:00 / 0:00</span>
                </div>
                <button class="btn-close" onclick="closePlayer()">Закрити</button>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="logo">Media<span>Hub</span></div>
        <div class="region">UA Trends</div>
    </div>

    <div id="list" class="list">
        <div style="padding:20px; text-align:center; color:#666;">Завантаження...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВАШ КЛЮЧ
        const API_KEY = 'AIzaSyDRPOH3nk1h-pEdGaPmWG9r0hwgzKcgt7A';

        // Змінні
        const listEl = document.getElementById('list');
        const playerArea = document.getElementById('player-area');
        const btnPlay = document.getElementById('btn-play');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const timeText = document.getElementById('time-text');

        let player; // Об'єкт плеєра
        let updateInterval; // Таймер для смужки

        // 1. ПІДКЛЮЧАЄМО YOUTUBE API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            console.log("YouTube API Ready");
        }

        // 2. ОТРИМАННЯ ТРЕНДІВ
        async function init() {
            try {
                const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=UA&maxResults=20&key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);
                renderList(data.items);

            } catch (e) {
                console.error(e);
                listEl.innerHTML = `<div class="error-box">Помилка: ${e.message}</div>`;
            }
        }

        function renderList(videos) {
            listEl.innerHTML = '';
            videos.forEach(item => {
                const el = document.createElement('div');
                el.className = 'card';
                const snip = item.snippet;
                const stats = item.statistics;
                
                el.innerHTML = `
                    <div class="thumb-wrapper">
                        <img class="thumb" src="${snip.thumbnails.medium.url}">
                    </div>
                    <div class="info">
                        <div class="details">
                            <div class="title">${snip.title}</div>
                            <div class="sub">${snip.channelTitle}</div>
                            <div class="stat">${formatViews(stats.viewCount)} переглядів</div>
                        </div>
                    </div>
                `;
                el.onclick = () => loadVideo(item.id);
                listEl.appendChild(el);
            });
        }

        // 3. ЛОГІКА ПЛЕЄРА
        function loadVideo(id) {
            playerArea.style.display = 'block';
            window.scrollTo(0,0);

            if (player) {
                player.loadVideoById(id);
            } else {
                player = new YT.Player('yt-placeholder', {
                    height: '100%',
                    width: '100%',
                    videoId: id,
                    playerVars: {
                        'playsinline': 1,
                        'controls': 0,        // ВИМИКАЄМО РІДНІ КНОПКИ
                        'disablekb': 1,       // Вимикаємо клавіатуру
                        'fs': 0,              // Без кнопки фулскріну
                        'rel': 0,             // Без рекомендацій в кінці
                        'modestbranding': 1,  // Мінімальний логотип
                        'iv_load_policy': 3   // Без анотацій
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        function onPlayerReady(event) {
            event.target.playVideo();
            startTimer();
        }

        function onPlayerStateChange(event) {
            // 1 = Playing, 2 = Paused
            if (event.data == YT.PlayerState.PLAYING) {
                btnPlay.innerText = "⏸"; // Пауза
                startTimer();
            } else {
                btnPlay.innerText = "▶"; // Плей
                stopTimer();
            }
        }

        // Клік по кнопці Play/Pause
        btnPlay.onclick = () => {
            if (!player) return;
            const state = player.getPlayerState();
            if (state === 1) { // Грає
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        };

        // Клік по смужці (перемотка)
        progressBar.onclick = (e) => {
            if (!player) return;
            const rect = progressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const percent = clickX / width;
            
            const duration = player.getDuration();
            player.seekTo(duration * percent, true);
        };

        // Оновлення таймера
        function startTimer() {
            stopTimer();
            updateInterval = setInterval(() => {
                if (!player || !player.getCurrentTime) return;
                const current = player.getCurrentTime();
                const total = player.getDuration();
                
                if (total > 0) {
                    const percent = (current / total) * 100;
                    progressFill.style.width = percent + '%';
                    timeText.innerText = formatTime(current) + " / " + formatTime(total);
                }
            }, 500);
        }

        function stopTimer() {
            clearInterval(updateInterval);
        }

        function closePlayer() {
            if (player) {
                player.stopVideo();
            }
            playerArea.style.display = 'none';
            stopTimer();
        }

        // Допоміжні функції
        function formatViews(num) {
            if (!num) return "0";
            if (num > 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num > 1000) return (num / 1000).toFixed(0) + 'K';
            return num;
        }

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return min + ":" + (sec < 10 ? '0' : '') + sec;
        }

        // Старт
        init();

    </script>
</body>
</html>
