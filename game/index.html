<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Tube</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- 1. СТИЛІ (ДИЗАЙН) --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #1c1c1e; /* Темний фон як у ТГ */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Плеєр (спочатку прихований) */
        #player-container {
            display: none; /* Ховаємо, поки немає відео */
            position: sticky;
            top: 0;
            background: #000;
            z-index: 100;
            border-bottom: 1px solid #333;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 40vh; /* Щоб не займало весь екран */
            display: block;
        }

        .close-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff3b30;
            color: white;
            border: none;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* Список відео */
        .video-list {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-card {
            background-color: #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .video-card:active {
            transform: scale(0.98); /* Ефект натискання */
        }

        .thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .info {
            padding: 12px;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .author {
            font-size: 13px;
            color: #aaaaaa;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <video id="main-player" controls playsinline autoplay></video>
        <button class="close-btn" onclick="closePlayer()">Закрити відео</button>
    </div>

    <h2 style="padding-left: 10px;">Тренди (UA)</h2>
    <div id="video-list" class="video-list">
        <div class="loading">Завантаження відео...</div>
    </div>

    <script>
        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо на весь екран
        
        // API сервер (публічний Piped)
        // const API_BASE = 'https://api.piped.privacy.com.de';
        const API_BASE = 'https://pipedapi.drgns.space';
        // const API_BASE = 'https://pipedapi.kavin.rocks'; 

        const videoListEl = document.getElementById('video-list');
        const playerContainer = document.getElementById('player-container');
        const player = document.getElementById('main-player');

        // 1. Функція запуску (стартує при відкритті)
        async function init() {
            try {
                // Отримуємо тренди України
                const response = await fetch(`${API_BASE}/trending?region=UA`);
                const videos = await response.json();
                
                renderVideos(videos);
            } catch (error) {
                videoListEl.innerHTML = `<div class="loading" style="color:red">Помилка: ${error.message}<br>Спробуйте оновити.</div>`;
            }
        }

        // 2. Функція малювання карток
        function renderVideos(videos) {
            videoListEl.innerHTML = ''; // Очистити "Завантаження..."

            videos.forEach(video => {
                // Створюємо HTML для однієї картки
                const card = document.createElement('div');
                card.className = 'video-card';
                // video.url виглядає як "/watch?v=ID" -> беремо тільки ID
                const videoId = video.url.split('v=')[1];

                card.innerHTML = `
                    <img class="thumb" src="${video.thumbnail}" alt="${video.title}">
                    <div class="info">
                        <div class="title">${video.title}</div>
                        <div class="author">${video.uploaderName}</div>
                    </div>
                `;

                // При кліку - запускаємо відео
                card.onclick = () => loadAndPlay(videoId);
                videoListEl.appendChild(card);
            });
        }

        // 3. Функція отримання прямого посилання (mp4) і старту
        async function loadAndPlay(videoId) {
            // Показуємо плеєр, але поки чорний екран
            playerContainer.style.display = 'block';
            window.scrollTo(0, 0); // Прокрутка вгору
            
            try {
                // Запит деталей відео
                const response = await fetch(`${API_BASE}/streams/${videoId}`);
                const data = await response.json();

                // Шукаємо потік mp4 (відео + звук)
                const stream = data.videoStreams.find(s => s.format === 'MPEG-4' && s.videoOnly === false);

                if (stream) {
                    player.src = stream.url;
                    player.play();
                } else {
                    alert("На жаль, прямий потік для цього відео не знайдено.");
                    closePlayer();
                }

            } catch (error) {
                console.error(error);
                alert("Не вдалося завантажити відео.");
                closePlayer();
            }
        }

        // 4. Закрити плеєр
        function closePlayer() {
            player.pause();
            player.src = "";
            playerContainer.style.display = 'none';
        }

        // Запускаємо все
        init();

    </script>
</body>
</html>
