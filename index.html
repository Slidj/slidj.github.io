<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEDIA HUB</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPM3X3960Y"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RPM3X3960Y',{'app_name':'MediaHub_TG','send_page_view':true});</script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=104">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="notification_bar">
        <span class="notif-icon">🔔</span>
        <div id="notif_text" style="flex: 1; font-weight: 500;"></div>
        <span class="notif-close" onclick="window.closeNotification()">&times;</span>
    </div>

    <div id="maintenance_screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000; text-align:center; flex-direction:column; justify-content:center; align-items:center; color:white; font-family: sans-serif;"><div style="font-size: 80px; margin-bottom: 20px;">🛠</div><h2>Технічне обслуговування</h2><p style="color:#808080; padding:0 40px;">Ми оновлюємо Media Hub для вас.</p></div>
    <div id="blocked_screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000; text-align:center; flex-direction:column; justify-content:center; align-items:center; color:white; font-family: sans-serif;"><div style="font-size: 80px; margin-bottom: 20px;">🚫</div><h2 style="color:red;">Доступ обмежено</h2><p style="color:#808080; padding:0 40px;">Ваш аккаунт було заблоковано.</p></div>

    <div id="preloader"><div class="netflix-loader"></div></div>

    <header class="netflix-header" style="padding-top: var(--safe-top);">
        <div class="logo">MEDIA HUB</div>
        <div class="header-right" onclick="window.toggleSideMenu()" style="cursor: pointer; padding: 5px;">
            <img id="user_avatar" src="" alt="" class="user-avatar-rounded" style="display:none;">
            <div id="default_avatar" style="font-size: 24px; background: #222; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">👤</div>
        </div>
    </header>

    <div id="filters_wrapper" class="netflix-filters"><button class="cat-btn active" onclick="setCategory('all')">Усі</button><button class="cat-btn" onclick="setCategory('movie')">Фільми</button><button class="cat-btn" onclick="setCategory('tv')">Серіали</button><button class="cat-btn" onclick="setCategory('16')">Мультики</button></div>
    <div id="search_bar_container" style="display:none;"><input type="text" id="search_input" placeholder="Пошук..." oninput="performSearchDelayed()"></div>
    <div id="main_scroll_area"><div id="hero_section" class="hero-banner" style="display:none;"><div class="hero-overlay"></div><div class="hero-content"><div class="hero-meta" id="hero_meta">Top 10 • Movies</div><h1 id="hero_title">Завантаження...</h1><div class="hero-buttons"><button class="hero-btn white" onclick="playHeroMovie()"><svg viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M8 5v14l11-7z"/></svg> Дивитись</button><button class="hero-btn gray" onclick="infoHeroMovie()"><svg viewBox="0 0 24 24" fill="white" width="24" height="24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path d="M12 16v-4M12 8h.01" stroke="white" stroke-width="3"/></svg> Інфо</button></div></div></div><div id="content_container" class="netflix-grid"></div><div id="infinite_trigger" style="height: 60px; display: flex; justify-content: center; align-items: center; width: 100%;"><div class="netflix-loader" style="width: 30px; height: 30px; border-width: 3px; display: none;" id="scroll_loader"></div></div><div style="height: 80px;"></div></div>

    <nav class="bottom-nav"><div class="nav-item active" onclick="switchMode('home')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Головна</span></div><div class="nav-item" onclick="switchMode('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>Пошук</span></div><div class="nav-item" onclick="switchMode('saved')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg><span>Моє</span></div></nav>

    <div id="menu_overlay" class="menu-overlay" onclick="window.toggleSideMenu()"></div>
    <div id="side_menu" class="side-menu">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;"><h3 style="color: white; margin:0;">Меню</h3><span onclick="window.toggleSideMenu()" style="color:#666; font-size:24px; cursor:pointer;">&times;</span></div>
        <div id="admin_stats_preview" class="menu-stats-box" style="display:none;"></div>
        <div id="admin_menu_item" class="menu-item admin-only-item" style="display:none;" onclick="window.openAdminFromMenu()"><span>⚙️ Адмін-панель</span></div>
        <div class="menu-item" onclick="window.toggleSideMenu()"><span>👤 Мій профіль</span></div>
        <div style="margin-top: auto; padding-bottom: 20px; text-align: center; color: #444; font-size: 11px;">MEDIA HUB v1.6.5</div>
    </div>

    <div id="admin_modal" class="modal-fullscreen" style="display:none; background: #141414; z-index: 100001;">
        <div style="padding: 20px; padding-top: calc(20px + var(--safe-top)); overflow-y: auto; height: 100%;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;"><h2 style="color:white; margin:0;">Адмін-панель</h2><button onclick="window.closeAdminPanel()" style="background:none; border:none; color:white; font-size:30px;">&times;</button></div>
            
            <div style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px;">
                <h3 style="color:white; font-size:14px; margin-top:0;">📣 Надіслати сповіщення</h3>
                <input type="text" id="notif_input" placeholder="Текст сповіщення..." style="width:100%; padding:10px; border-radius:5px; border:none; background:#333; color:white; margin-bottom:10px;">
                <button onclick="window.sendBroadcastNotification()" style="width:100%; padding:10px; background:#e50914; color:white; border:none; border-radius:5px; font-weight:bold;">ВІДПРАВИТИ ВСІМ</button>
            </div>

            <div id="admin_stats" style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px; color:#aaa; font-size:13px;"></div>
            <button id="maint_toggle_btn" onclick="window.toggleMaintenanceMode()" style="width:100%; padding:12px; border-radius:5px; border:none; font-weight:bold; margin-bottom:20px;"></button>
            <h3 style="color:white; font-size:16px;">Користувачі:</h3>
            <div id="admin_user_list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <div id="player_modal"><div class="close-player-btn" onclick="closePlayer()">&times;</div><iframe id="video_frame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <div id="movie_details_modal" class="modal-fullscreen details-modal" style="display: none;"><button class="close-round-btn" onclick="closeMoviePage()">&times;</button><div id="movie_details_content"></div></div>

    <script type="module" src="js/app.js?v=105"></script>
    <script>window.onload=function(){setTimeout(function(){const pre=document.getElementById('preloader');if(pre){pre.style.opacity='0';setTimeout(()=>pre.style.display='none',500);}},3000);};</script>
</body>
</html>
