<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>MEDIA HUB</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPM3X3960Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RPM3X3960Y', { 'app_name': 'MediaHub_TG', 'send_page_view': true });
    </script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=102">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="maintenance_screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000; text-align:center; flex-direction:column; justify-content:center; align-items:center; color:white; font-family: sans-serif;">
        <div style="font-size: 80px; margin-bottom: 20px;">🛠</div>
        <h2 style="font-size: 24px; margin-bottom: 10px;">Технічне обслуговування</h2>
        <p style="color:#808080; padding:0 40px; font-size: 16px; line-height: 1.4;">Ми оновлюємо Media Hub для вас. Поверніться за декілька годин!</p>
    </div>

    <div id="blocked_screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:20000; text-align:center; flex-direction:column; justify-content:center; align-items:center; color:white; font-family: sans-serif;">
        <div style="font-size: 80px; margin-bottom: 20px;">🚫</div>
        <h2 style="font-size: 24px; color:#e50914; margin-bottom: 10px;">Доступ обмежено</h2>
        <p style="color:#808080; padding:0 40px; font-size: 16px; line-height: 1.4;">Ваш аккаунт було заблоковано адміністратором.</p>
    </div>

    <div id="preloader">
        <div class="netflix-loader"></div>
    </div>

    <header class="netflix-header" style="padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 15px; padding-right: 15px;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="admin_btn" style="display:none; cursor: pointer; padding: 10px; z-index: 10001; margin-left: -10px;" onclick="window.openAdminPanel()">
                <svg viewBox="0 0 24 24" fill="white" width="28" height="28">
                    <path d="M12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5zm7.43-2.53l1.96-1.56c.18-.14.23-.4.11-.6l-2-3.46c-.12-.21-.37-.28-.58-.2l-2.31.93c-.48-.37-1-.69-1.57-.93l-.35-2.46c-.03-.23-.23-.4-.46-.4h-4c-.23 0-.43.17-.46.4l-.35 2.46c-.57.24-1.09.56-1.57.93l-2.31-.93c-.21-.08-.46 0-.58.2l-2 3.46c-.12.2-.07.46.11.6l1.96 1.56c-.03.17-.05.35-.05.53s.02.36.05.53l-1.96 1.56c-.18.14-.23.4-.11.6l2 3.46c.12.21.37.28.58.2l2.31-.93c.48.37 1 .69 1.57.93l.35 2.46c.03.23.23.4.46.4h4c.23 0 .43-.17.46-.4l.35-2.46c.57-.24 1.09-.56 1.57-.93l2.31.93c.21.08.46 0 .58-.2l2-3.46c.12-.2.07-.46-.11-.6l-1.96-1.56c.03-.17.05-.35.05-.53s-.02-.36-.05-.53z"></path>
                </svg>
            </div>
            <div class="logo">MEDIA HUB</div>
        </div>
        <div class="header-right">
            <img id="user_avatar" src="" alt="" style="display:none; width: 32px; height: 32px; border-radius: 50%;">
            <div id="default_avatar">👤</div>
        </div>
    </header>

    <div id="filters_wrapper" class="netflix-filters">
        <button class="cat-btn active" onclick="setCategory('all')">Усі</button>
        <button class="cat-btn" onclick="setCategory('movie')">Фільми</button>
        <button class="cat-btn" onclick="setCategory('tv')">Серіали</button>
        <button class="cat-btn" onclick="setCategory('16')">Мультики</button>
    </div>

    <div id="search_bar_container" style="display:none;">
        <input type="text" id="search_input" placeholder="Пошук фільмів, серіалів..." oninput="performSearchDelayed()">
    </div>

    <div id="main_scroll_area">
        <div id="hero_section" class="hero-banner" style="display:none;">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-meta" id="hero_meta">Top 10 • Movies</div>
                <h1 id="hero_title">Завантаження...</h1>
                <div class="hero-buttons">
                    <button class="hero-btn white" onclick="playHeroMovie()">
                        <svg viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M8 5v14l11-7z"/></svg> Дивитись
                    </button>
                    <button class="hero-btn gray" onclick="infoHeroMovie()">
                        <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path d="M12 16v-4M12 8h.01" stroke="white" stroke-width="3"/></svg> Інфо
                    </button>
                </div>
            </div>
        </div>

        <div id="content_container" class="netflix-grid"></div>
        <div id="infinite_trigger" style="height: 60px; display: flex; justify-content: center; align-items: center; width: 100%;">
            <div class="netflix-loader" style="width: 30px; height: 30px; border-width: 3px; display: none;" id="scroll_loader"></div>
        </div>
        <div style="height: 80px;"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchMode('home')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> <span>Головна</span>
        </div>
        <div class="nav-item" onclick="switchMode('search')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> <span>Пошук</span>
        </div>
        <div class="nav-item" onclick="switchMode('saved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg> <span>Моє</span>
        </div>
    </nav>

    <div id="admin_modal" class="modal-fullscreen" style="display:none; background: #141414; z-index: 10000;">
        <div style="padding: 20px; padding-top: calc(20px + var(--safe-top));">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2 style="color:white; margin:0;">Адмін-панель</h2>
                <button onclick="window.closeAdminPanel()" style="background:none; border:none; color:white; font-size:30px;">&times;</button>
            </div>
            
            <div id="admin_stats" style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px; color:#aaa; font-size:14px;">
                Завантаження статистики...
            </div>

            <div style="margin-bottom: 20px;">
                <button id="maint_toggle_btn" onclick="window.toggleMaintenanceMode()" style="width:100%; padding:12px; border-radius:5px; border:none; font-weight:bold; cursor:pointer;">
                    Завантаження...
                </button>
            </div>

            <h3 style="color:white; font-size:16px;">Користувачі:</h3>
            <div id="admin_user_list" style="display:flex; flex-direction:column; gap:10px;">
                </div>
        </div>
    </div>

    <div id="player_modal">
        <div class="close-player-btn" onclick="closePlayer()">&times;</div>
        <iframe id="video_frame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <div id="movie_details_modal" class="modal-fullscreen details-modal" style="display: none;">
        <button class="close-round-btn" onclick="closeMoviePage()">&times;</button>
        <div id="movie_details_content"></div>
    </div>

    <script type="module" src="js/app.js?v=100"></script>
    
    <script>
        window.onload = function() {
            setTimeout(function() {
                const pre = document.getElementById('preloader');
                if(pre) { pre.style.opacity = '0'; setTimeout(() => pre.style.display = 'none', 500); }
            }, 3000); 
        };
    </script>
</body>
</html>
