<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Media Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
    <div id="preloader">
        <video id="preload_video" autoplay muted playsinline loop>
            <source src="video/preload.mp4" type="video/mp4">
        </video>
    </div>

    <div id="ptr_spinner">
        <div class="spinner-icon"></div>
    </div>

    <header>
        <div class="profile-header">
            <img id="user_avatar" class="avatar-img" src="" alt="Avatar" style="display: none;">
            <div id="default_avatar" class="avatar-placeholder" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="header-text">
                <h1 id="header_title">Медіа Хаб</h1>
                <div class="user-rank">
                    <span id="rank_name">Читач 👶</span> • <span id="points_count">0</span> балів
                </div>
            </div>
        </div>
    </header>

    <div class="controls-container">
        <div id="filters_wrapper">
            <select id="category_select" onchange="performSearch()">
                <option value="">Усі категорії</option>
                <option value="business">Бізнес</option>
                <option value="entertainment">Розваги</option>
                <option value="health">Здоров'я</option>
                <option value="science">Наука</option>
                <option value="sports">Спорт</option>
                <option value="technology">Технології</option>
            </select>

            <div class="search-container">
                <input type="text" id="search_input" placeholder="Пошук..." />
                <button id="search_button" onclick="performSearch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="content_container" class="news-container">
        <p class="loading-status">Завантаження...</p>
    </div>

    <div id="load_more_container" style="display: none;">
        <button id="load_more_button" onclick="loadMore()">Завантажити ще</button>
    </div>

    <div id="fab_wrapper">
        <div class="fab-menu" id="fab_menu">
            <button class="fab-item" onclick="switchMode('saved')" title="Збережене">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </button>
            <button class="fab-item" onclick="switchMode('movies')" title="Кіно">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
            </button>
            <button class="fab-item active" onclick="switchMode('news')" title="Новини">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><line x1="8" y1="2" x2="8" y2="22"></line><line x1="16" y1="2" x2="16" y2="22"></line></svg>
                <svg style="display:none;" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path><path d="M18 14h-8"></path><path d="M15 18h-5"></path><path d="M10 6h8v4h-8V6z"></path></svg>
            </button>
        </div>

        <button id="fab_main" onclick="toggleFab()">
            <svg id="icon_menu" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <svg id="icon_close" style="display: none;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <script type="module" src="js/app.js?v=13"></script>
</body>

</html>
