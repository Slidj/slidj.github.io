<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Netflix Clone</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=75">
    
    
</head>
<body>

    <div id="preloader">
        <div class="netflix-loader"></div>
    </div>

    <header class="netflix-header">
        <div class="logo">MEDIA HUB</div>
        <div class="header-right">
            <img id="user_avatar" src="" alt="" style="display:none;">
            <div id="default_avatar">👤</div>
        </div>
    </header>

    <div id="filters_wrapper" class="netflix-filters">
        <button class="cat-btn active" onclick="setCategory('')">Усі</button>
        <button class="cat-btn" onclick="setCategory('movie')">Фільми</button>
        <button class="cat-btn" onclick="setCategory('tv')">Серіали</button>
        <button class="cat-btn" onclick="setCategory('16')">Мультфільми</button>
        <button class="cat-btn" onclick="setCategory('28')">Бойовики</button>
    </div>

    <div id="search_bar_container" style="display:none;">
        <input type="text" id="search_input" placeholder="Пошук фільмів, серіалів..." oninput="performSearchDelayed()">
    </div>

    <div id="main_scroll_area">
        <div id="hero_section" class="hero-banner" style="display:none;">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-meta" id="hero_meta">Top 10 • Movies</div>
                <h1 id="hero_title">Завантаження...</h1>
                <div class="hero-buttons">
                    <button class="hero-btn white" onclick="playHeroMovie()">
                        <svg viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M8 5v14l11-7z"/></svg> 
                        Дивитись
                    </button>
                    <button class="hero-btn gray" onclick="infoHeroMovie()">
                        <svg viewBox="0 0 24 24" fill="white" width="24" height="24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path d="M12 16v-4M12 8h.01" stroke="white" stroke-width="3"/></svg>
                        Інфо
                    </button>
                </div>
            </div>
        </div>

        <div id="content_container" class="netflix-grid"></div>
        
        <div id="infinite_trigger" style="height: 60px; display: flex; justify-content: center; align-items: center; width: 100%;">
            <div class="netflix-loader" style="width: 30px; height: 30px; border-width: 3px; display: none;" id="scroll_loader"></div>
        </div>
        
        <div style="height: 80px;"></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchMode('home')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Головна</span>
        </div>
        <div class="nav-item" onclick="switchMode('search')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Пошук</span>
        </div>
        <div class="nav-item" onclick="switchMode('saved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span>Моє</span>
        </div>
    </nav>

    <div id="player_modal">
        <div class="close-player-btn" onclick="closePlayer()">&times;</div>
        <iframe 
            id="video_frame" 
            src="" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <div id="movie_details_modal" class="modal-fullscreen details-modal" style="display: none;">
        <button class="close-round-btn" onclick="closeMoviePage()">&times;</button>
        <div id="movie_details_content"></div>
    </div>

    <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
