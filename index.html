<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEDIA HUB</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RPM3X3960Y"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RPM3X3960Y',{'app_name':'MediaHub_TG','send_page_view':true});</script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="css/style.css?v=255">

    <style>
        /* Глобальний глибокий чорний фон */
        body, html {
            background-color: #000000 !important;
            height: 100%;
        }

        /* --- СТИЛІ ДЛЯ ЗАСТАВКИ (INTRO) --- */
        #intro-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh; /* Використовуємо динамічну висоту для мобільних */
            background-color: #000000;
            z-index: 999999; /* Поверх усього */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        /* Стиль тексту MEDIA-HUB */
        .netflix-title-splash {
            margin: 0;
            padding: 0;
            /* Використовуємо жирний, вузький шрифт, схожий на кінематографічний */
            font-family: 'Impact', 'Arial Black', 'Helvetica Neue', sans-serif;
            /* Адаптивний розмір шрифту, залежить від ширини екрану */
            font-size: 15vw; 
            color: #E50914; /* Netflix Red */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            line-height: 1;
            /* Легка тінь для об'єму */
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            /* Застосовуємо м'яку анімацію пульсації */
            animation: gentlePulse 2.5s ease-in-out infinite;
            /* Початковий стан */
            transform: scale(1);
            opacity: 0.95;
        }

        /* Анімація м'якої пульсації (дихання) */
        @keyframes gentlePulse {
            0% {
                transform: scale(1);
                opacity: 0.95;
                text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            }
            50% {
                transform: scale(1.05); /* Ледь помітне збільшення */
                opacity: 1;
                /* Трохи посилюємо світіння на піку */
                text-shadow: 0 0 25px rgba(229, 9, 20, 0.4);
            }
            100% {
                transform: scale(1);
                opacity: 0.95;
                text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
            }
        }

        /* Стиль хедеру під Netflix */
        .netflix-header {
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            background-color: transparent;
        }
        .logo {
            color: #E50914 !important; /* Червоний логотип в шапці */
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="intro-loader">
        <h1 class="netflix-title-splash">MEDIA-HUB</h1>
    </div>

    <div id="notification_bar">
        <span style="font-size:20px;">🔔</span>
        <div id="notif_text" style="flex: 1; font-weight: 500;"></div>
        <span class="notif-close" onclick="window.closeNotification()">×</span>
    </div>

    <div id="donate_modal" class="modal-fullscreen" style="display:none; background: rgba(0,0,0,0.95); z-index: 100002; backdrop-filter: blur(10px); flex-direction:column;">
        <div class="donate-modal-content">
            <div style="font-size: 60px;">💎</div>
            <h2 data-i18n="donateTitle">Підтримка MEDIA HUB</h2>
            <div class="donate-option-card" onclick="window.selectDonateLevel(5)">
                <div class="donate-info"><span class="donate-name" data-i18n="donateLvl1">☕ Чашка кави</span><span class="donate-stars">5 Stars</span></div>
                <div style="font-size:24px;">⭐</div>
            </div>
            <div class="donate-option-card" onclick="window.selectDonateLevel(20)">
                <div class="donate-info"><span class="donate-name" data-i18n="donateLvl2">🍿 Квиток у кіно</span><span class="donate-stars">20 Stars</span></div>
                <div style="font-size:24px;">⭐</div>
            </div>
            <div class="donate-option-card" onclick="window.selectDonateLevel(50)">
                <div class="donate-info"><span class="donate-name" data-i18n="donateLvl3">👑 Меценат проекту</span><span class="donate-stars">50 Stars</span></div>
                <div style="font-size:24px;">⭐</div>
            </div>
            <button class="donate-btn-close" onclick="window.closeDonateMenu()" data-i18n="donateClose">Можливо пізніше</button>
        </div>
    </div>

    <header class="netflix-header" style="padding-top: var(--safe-top);">
        <div class="logo">MEDIA HUB</div>
        <div class="header-right" onclick="window.toggleSideMenu()" style="cursor: pointer; padding: 5px;">
            <img id="user_avatar" src="" alt="" class="user-avatar-rounded" style="display:none;">
            <div id="default_avatar" style="font-size: 24px; background: #222; border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">👤</div>
        </div>
    </header>

    <div id="filters_wrapper" class="netflix-filters">
        <button class="cat-btn active" onclick="setCategory('all', this)" data-i18n="catAll">Усі</button>
        <button class="cat-btn" onclick="setCategory('movie', this)" data-i18n="catMovies">Фільми</button>
        <button class="cat-btn" onclick="setCategory('tv', this)" data-i18n="catSeries">Серіали</button>
        <button class="cat-btn" onclick="setCategory('16', this)" data-i18n="catCartoons">Мультики</button>
    </div>

    <div id="search_bar_container">
        <input type="text" id="search_input" oninput="performSearchDelayed()" placeholder="Пошук...">
    </div>

    <div id="main_scroll_area">
        <div id="hero_section" class="hero-banner" style="display:none;">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-meta" id="hero_meta">Top 10</div>
                <h1 id="hero_title">Loading...</h1>
                <div class="hero-buttons">
                    <button class="hero-btn white" onclick="playHeroMovie()"><svg viewBox="0 0 24 24" fill="black" width="24" height="24"><path d="M8 5v14l11-7z"/></svg> <span data-i18n="watch">Дивитись</span></button>
                    <button class="hero-btn gray" onclick="infoHeroMovie()"><svg viewBox="0 0 24 24" fill="white" width="24" height="24"><circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="none"/><path d="M12 16v-4M12 8h.01" stroke="white" stroke-width="3"/></svg> <span data-i18n="btnInfo">Інфо</span></button>
                </div>
            </div>
        </div>
        <div id="content_container" class="netflix-grid"></div>
        <div id="infinite_trigger" style="height: 60px; display: flex; justify-content: center; align-items: center; width: 100%;"><div class="netflix-loader" id="scroll_loader" style="display:none;"></div></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchMode('home')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span data-i18n="tabHome">Головна</span>
        </div>
        <div class="nav-item" onclick="switchMode('search')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span data-i18n="tabSearch">Пошук</span>
        </div>
        <div class="nav-item" onclick="switchMode('saved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            <span data-i18n="tabSaved">Моє</span>
        </div>
    </nav>

    <div id="menu_overlay" class="menu-overlay" onclick="window.toggleSideMenu()"></div>
    <div id="side_menu" class="side-menu">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;"><h3 style="color: white; margin:0;" data-i18n="menuTitle">Меню</h3><span onclick="window.toggleSideMenu()" style="color:#666; font-size:24px; cursor:pointer;">×</span></div>
        <div id="admin_stats_preview" class="menu-stats-box" style="display:none;"></div>
        <div id="admin_menu_item" class="menu-item admin-only-item" style="display:none;" onclick="window.openAdminFromMenu()"><span data-i18n="menuAdmin">⚙️ Адмін-панель</span></div>
        <div class="menu-item donate-item" onclick="window.openDonateMenu()"><span data-i18n="menuDonate">⭐ Підтримати проект</span></div>
        <div class="menu-item" onclick="window.toggleSideMenu()"><span data-i18n="menuProfile">👤 Мій профіль</span></div>
        <div style="margin-top: auto; padding-bottom: 20px; text-align: center; color: #444; font-size: 11px;">MEDIA HUB v1.9.6</div>
    </div>

    <div id="admin_modal" class="modal-fullscreen" style="display:none; background: #141414; z-index: 100001;">
        <div style="padding: 20px; padding-top: calc(20px + var(--safe-top)); overflow-y: auto; height: 100%;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h2 style="color:white; margin:0;">Адмін-панель</h2>
                <button onclick="window.closeAdminPanel()" style="background:none; border:none; color:white; font-size:30px;">×</button>
            </div>
            <div style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px;">
                <h3 style="color:white; font-size:14px; margin-top:0;">📣 Надіслати сповіщення</h3>
                <input type="text" id="notif_input" placeholder="Текст сповіщення..." style="width:100%; padding:10px; border-radius:5px; border:none; background:#333; color:white; margin-bottom:10px;">
                <button onclick="window.sendBroadcastNotification()" style="width:100%; padding:10px; background:#e50914; color:white; border:none; border-radius:5px; font-weight:bold;">ВІДПРАВИТИ ВСІМ</button>
            </div>
            <div id="admin_stats" style="background:#222; padding:15px; border-radius:10px; margin-bottom:20px; color:#aaa; font-size:13px;"></div>
            <button id="maint_toggle_btn" onclick="window.toggleMaintenanceMode()" style="width:100%; padding:12px; border-radius:5px; border:none; font-weight:bold; margin-bottom:20px; cursor:pointer;"></button>
            <h3 style="color:white; font-size:16px;">Користувачі:</h3>
            <div id="admin_user_list"></div>
        </div>
    </div>

    <div id="player_modal"><div class="close-player-btn" onclick="window.closePlayer()">×</div><iframe id="video_frame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <div id="movie_details_modal" class="modal-fullscreen details-modal" style="display: none;"><button class="close-round-btn" onclick="window.closeMoviePage()">×</button><div id="movie_details_content"></div></div>

    <script>
        // 1. Логіка мови: Якщо не UA -> перемикаємо на EN
        try {
            const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
            if (tgUser && tgUser.language_code) {
                const userLang = tgUser.language_code.toLowerCase();
                // Якщо мова не 'uk' (українська), примусово ставимо 'en'
                if (userLang !== 'uk') {
                    localStorage.setItem('mediaHubLang', 'en');
                } else {
                    localStorage.setItem('mediaHubLang', 'uk');
                }
            }
        } catch (e) {
            console.log('Lang check skipped');
        }

        // 2. Логіка зникнення заставки
        window.addEventListener('load', () => {
            const preloader = document.getElementById('intro-loader');
            
            // Затримка 3.5 секунди перед початком зникнення
            setTimeout(() => {
                preloader.style.opacity = '0';
                // Після завершення анімації зникнення (0.8с) прибираємо елемент повністю
                setTimeout(() => {
                    preloader.style.display = 'none';
                    preloader.style.visibility = 'hidden';
                }, 800);
            }, 3500);
        });
    </script>

    <script type="module" src="js/app.js?v=245"></script>
</body>
</html>
