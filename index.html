<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мінімальний Web App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            /* Встановлення кольору фону відповідно до теми Telegram */
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }
        h1 {
            color: var(--tg-theme-link-color);
        }
        button {
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    
    <h1>Привіт від Web App!</h1>
    
    <p>Ваші дані (отримані від Telegram):</p>
    <div id="user_info">Завантаження даних...</div>
    
    <button onclick="sendData()">Надіслати дані боту</button>
    
    <script src="script.js"></script>

</body>
</html>
