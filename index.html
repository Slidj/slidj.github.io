<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мінімальний Web App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <body>
    <header>
        <h1>📰 Новини дня</h1>
    </header>
    
    <div class="controls-container">
        
        <select id="category_select" onchange="performSearch()">
            <option value="">Усі категорії</option>
            <option value="business">Бізнес</option>
            <option value="entertainment">Розваги</option>
            <option value="health">Здоров'я</option>
            <option value="science">Наука</option>
            <option value="sports">Спорт</option>
            <option value="technology">Технології</option>
            </select>
        
        <div class="search-container">
            <input type="text" id="search_input" placeholder="Введіть ключові слова..." />
            <button id="search_button" onclick="performSearch()">Пошук</button>
        </div>
        
    </div>
    
    <div id="news_container">
        <p>Завантаження останніх новин...</p>
    </div>


<div id="news_container">
    <p class="loading-status">Завантаження останніх новин...</p>
</div>

<div id="load_more_container" style="display: none; text-align: center; padding: 20px;">
    <button id="load_more_button" onclick="loadMoreNews()">Завантажити ще</button>
</div>

        
        
    <script src="script.js"></script>
</body>
